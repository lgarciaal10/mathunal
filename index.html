/* ══ home ══ */

:root{
  --bg:    #090c18;
  --bg2:   #0d1023;
  --card:  #111628;
  --card2: #161d32;
  --acc:   #e05d1a;
  --adim:  rgba(224,93,26,.12);
  --aglow: rgba(224,93,26,.25);
  --grn:   #22c55e;
  --yel:   #f59e0b;
  --red:   #f87171;
  --t1:    #eef2ff;
  --t2:    #6b7a9a;
  --t3:    #2a3354;
  --br:    rgba(255,255,255,.07);
  --bra:   rgba(224,93,26,.35);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--t1);overflow-x:hidden}
a{color:inherit;text-decoration:none}
em{font-style:normal}

/* NAV */
#nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;
  padding:1.1rem 3rem;gap:2rem;
  transition:background .3s,border-color .3s,backdrop-filter .3s;
  border-bottom:1px solid transparent;
}
:root{--nav-bg:rgba(9,12,24,.65)}
#nav.on{background:var(--nav-bg);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-bottom-color:var(--br)}
.logo{display:flex;align-items:center;gap:.6rem;white-space:nowrap}
.logo-ico{
  width:34px;height:34px;border-radius:9px;
  background:var(--acc);display:flex;align-items:center;justify-content:center;
  font-family:'Playfair Display',serif;font-weight:900;font-size:1rem;color:#fff;flex-shrink:0;
}
.logo-txt{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;letter-spacing:-.3px;color:var(--t1)}
.logo-txt em{color:var(--acc)}
.nav-links{display:flex;align-items:center;justify-content:center;gap:2.2rem}
.nav-links a{color:var(--t2);font-size:.88rem;font-weight:500;transition:color .2s}
.nav-links a:hover{color:var(--t1)}
.nav-cta{
  background:var(--acc);color:#fff;
  padding:.5rem 1.3rem;border-radius:8px;
  font-size:.88rem;font-weight:600;
  box-shadow:0 0 20px var(--aglow);
  transition:filter .2s,transform .2s;white-space:nowrap;
}
.nav-cta:hover{filter:brightness(1.1);transform:translateY(-1px)}
.burger{display:none;background:none;border:none;color:var(--t1);font-size:1.4rem;cursor:pointer}
#mob{
  display:none;flex-direction:column;gap:.4rem;
  position:fixed;top:68px;left:0;right:0;z-index:199;
  background:rgba(9,12,24,.92);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  padding:1.4rem 2rem;border-bottom:1px solid var(--br);
}
#mob.open{display:flex}
#mob a{padding:.6rem 0;color:var(--t2);border-bottom:1px solid var(--br);font-weight:500;font-size:.95rem}
#mob a:last-child{border:none;color:var(--acc);font-weight:700}


/* ── NAV CONTROLS (lang + theme) ── */
.nav-controls{display:flex;align-items:center;gap:.4rem;margin-left:.5rem}
.ctrl-sep{width:1px;height:16px;background:var(--br);margin:0 .2rem}
.ctrl-btn{
  background:rgba(255,255,255,.05);border:1px solid var(--br);
  border-radius:6px;padding:.28rem .52rem;cursor:pointer;
  font-size:.7rem;font-weight:600;color:var(--t2);
  font-family:'JetBrains Mono',monospace;letter-spacing:.03em;
  transition:all .2s;white-space:nowrap;line-height:1;
}
.ctrl-btn-old:hover{background:var(--adim);border-color:var(--bra);color:var(--t1)}
body{transition:background .3s,color .3s}

/* HERO */
.hero{
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:7rem 2rem 4rem;
  position:relative;overflow:hidden;
}
.hero-bg{
  position:absolute;inset:0;
  background:radial-gradient(ellipse 65% 55% at 50% 45%,rgba(224,93,26,.07) 0%,transparent 65%);
  pointer-events:none;
}
.hero-in{position:relative;z-index:1;max-width:760px;width:100%}
.hero-badge{
  display:inline-flex;align-items:center;gap:.5rem;
  border:1px solid var(--bra);border-radius:999px;
  padding:.32rem 1rem;margin-bottom:2.2rem;
  font-family:'JetBrains Mono',monospace;font-size:.68rem;
  color:var(--t2);letter-spacing:.08em;text-transform:uppercase;
  background:rgba(224,93,26,.06);
}
.hb-dot{width:6px;height:6px;border-radius:50%;background:var(--acc);flex-shrink:0}
.hero-title{
  font-family:'Playfair Display',serif;font-weight:900;
  font-size:clamp(4.5rem,14vw,11rem);
  line-height:.88;letter-spacing:-2px;
  margin-bottom:1.5rem;display:flex;flex-direction:column;align-items:center;
}
.ht-top{color:var(--t1)}
.ht-bot{
  background:linear-gradient(90deg,var(--t1) 0%,var(--t1) 35%,#e05d1a 75%,#ff8c42 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.hero-tagline{
  font-family:'JetBrains Mono',monospace;font-size:.72rem;
  color:var(--t3);letter-spacing:.12em;text-transform:uppercase;margin-bottom:1.2rem;
}
.hero-sub{
  font-size:1.05rem;color:var(--t2);font-weight:400;
  max-width:480px;margin:0 auto 2.2rem;line-height:1.8;
}
.hero-sub strong{color:var(--t1);font-weight:600}
.hero-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-bottom:2.8rem}
.btn-a{
  display:inline-flex;align-items:center;gap:.42rem;
  padding:.85rem 1.8rem;border-radius:8px;
  font-weight:600;font-size:.93rem;cursor:pointer;border:none;
  background:var(--acc);color:#fff;
  box-shadow:0 0 24px var(--aglow);transition:all .2s;
}
.btn-a:hover{filter:brightness(1.1);transform:translateY(-2px)}
.btn-o{
  display:inline-flex;align-items:center;gap:.42rem;
  padding:.85rem 1.8rem;border-radius:8px;
  font-weight:600;font-size:.93rem;cursor:pointer;border:none;
  background:transparent;color:var(--t2);
  border:1px solid var(--br);transition:all .2s;
}
.btn-o:hover{border-color:rgba(255,255,255,.18);color:var(--t1);transform:translateY(-2px)}
.hero-stats{
  display:flex;align-items:center;justify-content:center;gap:0;
  border:1px solid var(--br);border-radius:12px;
  background:rgba(255,255,255,.03);overflow:hidden;
}
.hs-item{
  flex:1;padding:1rem 1.5rem;text-align:center;
  border-right:1px solid var(--br);
}
.hs-item:last-child{border-right:none}
.hs-n{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:900;color:var(--acc);display:block;letter-spacing:-1px}
.hs-l{font-size:.65rem;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;font-family:'JetBrains Mono',monospace}
.cat-tabs{
  display:flex;gap:.45rem;justify-content:center;flex-wrap:wrap;margin-top:1.8rem;
}
.cat-tab{
  background:rgba(255,255,255,.04);border:1px solid var(--br);
  color:var(--t2);font-size:.8rem;font-weight:500;
  cursor:pointer;border-radius:999px;padding:.38rem .95rem;
  transition:all .2s;white-space:nowrap;
}
.cat-tab:hover,.cat-tab.on{background:var(--adim);border-color:var(--bra);color:var(--t1)}

/* SECTION BASE */
section{padding:5rem 3rem}
.wrap{max-width:1200px;margin:0 auto}
.sec-label{
  font-family:'JetBrains Mono',monospace;font-size:.68rem;
  color:var(--acc);letter-spacing:.1em;text-transform:uppercase;
  display:block;margin-bottom:.6rem;
}
.sec-split{display:flex;align-items:flex-start;justify-content:space-between;gap:3rem;margin-bottom:2.8rem;flex-wrap:wrap}
.sec-split-l h2{
  font-family:'Playfair Display',serif;font-weight:900;
  font-size:clamp(2rem,5vw,3.2rem);letter-spacing:-.5px;line-height:1.05;
}
.sec-split-l h2 i{font-style:italic;font-weight:700;color:var(--t2)}
.sec-split-r{max-width:360px;color:var(--t2);font-size:.93rem;line-height:1.7;padding-top:.4rem}
.sec-split-r strong{color:var(--t1)}

/* MATERIAS GRID */
.mat-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--br);border:1px solid var(--br);border-radius:16px;overflow:hidden}
.mat-row2{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--br)}
.mc{
  background:var(--card);padding:1.6rem;
  display:flex;flex-direction:column;cursor:pointer;
  transition:background .2s;position:relative;
}
.mc:hover{background:var(--card2)}
.mc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem}
.mc-sem{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
.mc-pop{
  font-size:.6rem;font-weight:700;color:var(--acc);
  background:var(--adim);padding:.1rem .4rem;border-radius:4px;
  font-family:'JetBrains Mono',monospace;letter-spacing:.04em;
}
.mc-sym{position:absolute;top:1rem;right:1.2rem;font-size:3rem;color:var(--acc);opacity:.05;font-family:'Playfair Display',serif;line-height:1}
.b-large .mc-sym{font-size:5rem}
.mc-title{font-family:'Playfair Display',serif;font-weight:700;font-size:1.1rem;margin-bottom:.5rem;line-height:1.2}
.b-large .mc-title{font-size:1.4rem}
.mc-desc{font-size:.8rem;color:var(--t2);line-height:1.55;margin-bottom:.9rem;flex:1}
.b-small .mc-desc{display:none}
.mc-tags{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.85rem}
.mc-tag{
  font-size:.6rem;color:var(--t3);background:rgba(255,255,255,.05);
  border:1px solid var(--br);border-radius:3px;padding:.1rem .38rem;
}
.b-small .mc-tags{display:none}
.mc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.mc-pdfs{font-family:'JetBrains Mono',monospace;font-size:.63rem;color:var(--t3)}
.mc-link{font-size:.8rem;color:var(--acc);font-weight:600;transition:gap .2s;display:flex;align-items:center;gap:.25rem}
.mc:hover .mc-link{gap:.45rem}

/* STATS CARDS */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:4rem}
.stat-card{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:1.6rem;text-align:center}
.stat-ico{font-size:1.5rem;margin-bottom:.7rem;display:block}
.stat-n{font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;color:var(--acc);letter-spacing:-1px;display:block;line-height:1}
.stat-l{font-size:.72rem;color:var(--t2);margin-top:.25rem;display:block}

/* MATERIAL (freemium) */
.mat-free-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;align-items:start}
.free-card{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:1.8rem}
.free-card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:.4rem}
.free-plan-label{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--t3);text-transform:uppercase;letter-spacing:.08em}
.free-plan-ico{color:var(--t2);font-size:1.1rem}
.free-title{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:700;margin-bottom:.25rem}
.free-sub{font-size:.8rem;color:var(--t2);margin-bottom:1.4rem}
.free-divider{height:1px;background:var(--br);margin:1.2rem 0}
.free-item{display:flex;align-items:center;gap:.85rem;padding:.7rem 0;border-bottom:1px solid var(--br)}
.free-item:last-child{border:none}
.fi-ico{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
.fi-txt h5{font-size:.88rem;font-weight:600;margin-bottom:.08rem}
.fi-txt p{font-size:.73rem;color:var(--t2)}
.fi-chk{margin-left:auto;color:var(--grn);font-size:.9rem;flex-shrink:0}
.free-note{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--t3);margin-top:.9rem;display:flex;align-items:center;gap:.4rem}

.prem-card{background:var(--card);border:1.5px solid var(--bra);border-radius:14px;padding:1.8rem;position:relative;overflow:hidden}
.prem-glow{position:absolute;top:-60px;right:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(224,93,26,.13),transparent 65%);pointer-events:none}
.prem-top-line{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent)}
.prem-badge{
  display:inline-flex;align-items:center;gap:.28rem;
  background:var(--acc);color:#fff;
  font-family:'JetBrains Mono',monospace;font-size:.6rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;padding:.2rem .65rem;border-radius:4px;margin-bottom:1rem;
}
.prem-title{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:700;margin-bottom:.3rem}
.prem-sub{font-size:.83rem;color:var(--t2);margin-bottom:1.3rem;line-height:1.6}
.prem-list{display:flex;flex-direction:column;gap:.5rem;margin-bottom:1.3rem}
.pl-row{display:flex;align-items:center;gap:.6rem;font-size:.86rem;color:#cdd5e8}
.pl-chk{color:var(--grn);flex-shrink:0}
.prem-price-row{
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
  border-radius:9px;padding:.85rem 1.1rem;margin-bottom:.95rem;
}
.pp-l small{font-family:'JetBrains Mono',monospace;font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);display:block;margin-bottom:.15rem}
.pp-price{font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;color:var(--acc);line-height:1}
.pp-price s{font-size:.8rem;font-weight:400;color:var(--t3);margin-left:.3rem}
.pp-r{text-align:right;font-size:.73rem;color:var(--t2);line-height:1.55}
.pp-r span{color:var(--grn);font-weight:700}
.btn-buy{
  display:flex;align-items:center;justify-content:center;gap:.42rem;
  width:100%;background:var(--acc);color:#fff;border:none;border-radius:9px;
  padding:.95rem;font-size:.95rem;font-weight:600;cursor:pointer;
  box-shadow:0 4px 20px var(--aglow);transition:all .2s;
}
.btn-buy:hover{filter:brightness(1.1);transform:translateY(-2px)}
.prem-secure{text-align:center;margin-top:.7rem;font-size:.7rem;color:var(--t3);font-family:'JetBrains Mono',monospace}
.prem-secure span{
  display:inline-block;background:rgba(255,255,255,.06);
  border:1px solid var(--br);border-radius:4px;
  padding:.08rem .4rem;margin:0 .15rem;font-size:.6rem;
}

/* SIMULACROS */
.sim-filters{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.8rem}
.sim-filter{
  background:rgba(255,255,255,.04);border:1px solid var(--br);
  color:var(--t2);font-size:.78rem;font-weight:500;
  cursor:pointer;border-radius:999px;padding:.3rem .85rem;transition:all .2s;
}
.sim-filter:hover,.sim-filter.on{background:var(--adim);border-color:var(--bra);color:var(--t1)}
.sim-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1rem}
.sim-card{
  background:var(--card);border:1px solid var(--br);border-radius:12px;padding:1.3rem;
  display:flex;flex-direction:column;gap:.75rem;transition:border-color .2s,transform .2s;
}
.sim-card:hover{border-color:var(--bra);transform:translateY(-2px)}
.sim-top{display:flex;align-items:center;justify-content:space-between}
.sim-mat{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--acc);text-transform:uppercase;letter-spacing:.04em}
.sim-yr{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--t3)}
.sim-title{font-family:'Playfair Display',serif;font-size:.95rem;font-weight:700;line-height:1.3;color:var(--t1)}
.sim-meta{display:flex;gap:.4rem;flex-wrap:wrap}
.sb{font-size:.6rem;font-weight:600;padding:.12rem .42rem;border-radius:4px;font-family:'JetBrains Mono',monospace}
.sb-time{color:#60a5fa;background:rgba(96,165,250,.1)}
.sb-type{color:var(--t2);background:rgba(255,255,255,.06)}
.sb-free{color:var(--grn);background:rgba(34,197,94,.1)}
.sb-prem{color:var(--yel);background:rgba(245,158,11,.1)}
.sim-foot{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-top:auto}
.sim-topics{font-size:.74rem;color:var(--t2)}
.sim-btn{font-size:.78rem;font-weight:600;padding:.4rem .85rem;border-radius:6px;border:none;cursor:pointer;transition:all .2s;white-space:nowrap}
.sb-dl{background:var(--acc);color:#fff}
.sb-dl:hover{filter:brightness(1.1)}
.sb-lock{background:rgba(255,255,255,.06);color:var(--t2);border:1px solid var(--br)}
.sb-lock:hover{border-color:var(--bra);color:var(--t1)}

/* MODO PÁNICO */
.panic-bar{
  margin-top:2rem;
  background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);
  border-radius:12px;padding:1.4rem 1.8rem;
  display:flex;align-items:center;justify-content:space-between;gap:1.5rem;flex-wrap:wrap;
}
.panic-l{display:flex;align-items:center;gap:.9rem}
.panic-ico{font-size:1.6rem;animation:shake 3s ease-in-out infinite}
@keyframes shake{0%,88%,100%{transform:none}91%{transform:rotate(-6deg)}95%{transform:rotate(6deg)}}
.panic-l h4{font-size:.95rem;font-weight:700;margin-bottom:.18rem}
.panic-l p{font-size:.78rem;color:var(--t2)}
.btn-panic{
  display:inline-flex;align-items:center;gap:.42rem;
  padding:.75rem 1.4rem;border-radius:8px;border:none;cursor:pointer;
  background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;
  font-size:.85rem;font-weight:600;white-space:nowrap;
  box-shadow:0 0 20px rgba(239,68,68,.3);transition:all .2s;
}
.btn-panic:hover{filter:brightness(1.1);transform:translateY(-1px)}
.panic-modal{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:1rem}
.panic-modal.open{display:flex}
.pm-box{background:var(--card);border:1px solid rgba(239,68,68,.25);border-radius:18px;padding:2rem;max-width:460px;width:100%;position:relative}
.pm-close{position:absolute;top:1rem;right:1rem;background:none;border:none;color:var(--t2);font-size:1.2rem;cursor:pointer;transition:color .2s}
.pm-close:hover{color:var(--t1)}
.pm-box h3{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;margin-bottom:.3rem}
.pm-sub{color:var(--t2);font-size:.84rem;margin-bottom:1.4rem}
.pm-steps{display:flex;flex-direction:column;gap:.65rem;margin-bottom:1.4rem}
.pm-step{display:flex;align-items:flex-start;gap:.8rem;background:rgba(255,255,255,.03);border:1px solid var(--br);border-radius:10px;padding:.8rem}
.pm-h{width:26px;height:26px;border-radius:50%;background:rgba(239,68,68,.15);color:#ef4444;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:700;flex-shrink:0;margin-top:.05rem}
.pm-step h5{font-size:.84rem;font-weight:600;margin-bottom:.12rem}
.pm-step p{font-size:.76rem;color:var(--t2);line-height:1.55}
.pm-tip{background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.2);border-radius:9px;padding:.85rem;font-size:.77rem;color:var(--t2);line-height:1.6}
.pm-tip strong{color:var(--yel)}

/* CALCULADORA */
.calc-s{background:var(--bg2)}
.calc-wrap{display:grid;grid-template-columns:1fr 1.1fr;gap:4rem;align-items:center}
.calc-l h2{font-family:'Playfair Display',serif;font-size:clamp(1.8rem,4vw,2.8rem);font-weight:900;letter-spacing:-.5px;line-height:1.05;margin-bottom:.6rem}
.calc-l h2 i{font-style:italic;color:var(--acc)}
.calc-l p{color:var(--t2);font-size:.93rem;line-height:1.7;margin-bottom:1.4rem}
.calc-widget{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:1.8rem}
.calc-tabs{display:flex;gap:.4rem;margin-bottom:1.4rem}
.calc-tab{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--br);color:var(--t2);font-size:.82rem;font-weight:600;border-radius:8px;padding:.48rem;cursor:pointer;transition:all .2s}
.calc-tab.on{background:var(--adim);border-color:var(--bra);color:var(--t1)}
.calc-body{display:none}
.calc-body.on{display:block}
.calc-hdr{display:grid;grid-template-columns:2fr 1fr 1fr;gap:.6rem;margin-bottom:.4rem}
.calc-hdr span{font-size:.64rem;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;font-family:'JetBrains Mono',monospace;text-align:center}
.calc-hdr span:first-child{text-align:left}
.calc-row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:.6rem;align-items:center;margin-bottom:.5rem}
.calc-lbl{font-size:.8rem;color:var(--t2);font-weight:500}
.calc-inp{background:rgba(255,255,255,.05);border:1px solid var(--br);border-radius:7px;padding:.5rem .7rem;color:var(--t1);font-size:.85rem;font-family:'JetBrains Mono',monospace;outline:none;width:100%;transition:border-color .2s;text-align:center}
.calc-inp:focus{border-color:var(--bra)}
.calc-inp::placeholder{color:var(--t3)}
.calc-divider{height:1px;background:var(--br);margin:1.1rem 0}
.calc-result{background:rgba(255,255,255,.03);border:1px solid var(--br);border-radius:12px;padding:1.2rem;text-align:center;transition:all .3s}
.cr-label{font-size:.68rem;color:var(--t2);text-transform:uppercase;letter-spacing:.08em;font-family:'JetBrains Mono',monospace;margin-bottom:.4rem;display:block}
.cr-value{font-family:'Playfair Display',serif;font-size:2.8rem;font-weight:900;letter-spacing:-2px;line-height:1;margin-bottom:.3rem;display:block;transition:color .3s}
.cr-msg{font-size:.78rem;color:var(--t2);line-height:1.5;display:block}
.cr-green{color:var(--grn)!important}
.cr-yellow{color:var(--yel)!important}
.cr-red{color:var(--red)!important}
.cr-blue{color:#60a5fa!important}

/* COMUNIDAD */
.comm-s{border-top:1px solid var(--br);border-bottom:1px solid var(--br);background:var(--bg2)}
.comm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.5rem}
.cc{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:1.5rem;transition:border-color .2s,transform .2s}
.cc:hover{transform:translateY(-3px)}
.cc-ico{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem;margin-bottom:.9rem}
.cc h4{font-size:.95rem;font-weight:700;margin-bottom:.45rem}
.cc p{font-size:.8rem;color:var(--t2);line-height:1.6;margin-bottom:.9rem}
.cc-link{font-size:.82rem;font-weight:600;display:flex;align-items:center;gap:.28rem;transition:gap .2s}
.cc:hover .cc-link{gap:.5rem}
.cc-wa{border-color:rgba(37,211,102,.2)}.cc-wa .cc-ico{background:rgba(37,211,102,.12);color:#25D366}.cc-wa .cc-link{color:#25D366}
.cc-tg{border-color:rgba(42,171,238,.2)}.cc-tg .cc-ico{background:rgba(42,171,238,.12);color:#2AABEE}.cc-tg .cc-link{color:#2AABEE}
.cc-dc{border-color:rgba(88,101,242,.2)}.cc-dc .cc-ico{background:rgba(88,101,242,.12);color:#5865F2}.cc-dc .cc-link{color:#5865F2}
.cc-ig{border-color:rgba(225,48,108,.2)}.cc-ig .cc-ico{background:rgba(225,48,108,.12);color:#E1306C}.cc-ig .cc-link{color:#E1306C}
.comm-share{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.1rem 1.4rem;border:1px solid var(--br);border-radius:10px;background:rgba(255,255,255,.02);flex-wrap:wrap}
.comm-share p{font-size:.85rem;color:var(--t2)}
.comm-share strong{color:var(--t1)}
.comm-share a{font-size:.82rem;color:var(--acc);font-weight:600;display:flex;align-items:center;gap:.3rem}

/* TESTIMONIALS */
.test-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.tc-big{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:2rem;display:flex;flex-direction:column;gap:1rem}
.tc-sm{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:1.5rem}
.stars{color:var(--acc);font-size:.82rem;letter-spacing:2px;margin-bottom:.6rem;display:block}
.tq{color:var(--t2);font-size:.9rem;line-height:1.72;font-style:italic;flex:1}
.tc-big .tq{font-size:.96rem}
.sub-pill{display:inline-block;font-size:.65rem;color:var(--acc);background:var(--adim);border:1px solid var(--bra);border-radius:4px;padding:.12rem .42rem;margin-bottom:.6rem;font-family:'JetBrains Mono',monospace}
.tw{display:flex;align-items:center;gap:.6rem;margin-top:.6rem}
.av{width:34px;height:34px;border-radius:50%;background:var(--adim);color:var(--acc);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700;font-size:.78rem;flex-shrink:0}
.an{font-weight:600;font-size:.84rem}
.ac{font-size:.7rem;color:var(--t3)}

/* INSTAGRAM PROMO */
.ig-promo{
  background:var(--card);border:1px solid var(--br);border-radius:12px;
  padding:1.3rem 1.8rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-top:2.5rem;
}
.ig-promo-l{display:flex;align-items:center;gap:.8rem}
.ig-dot{width:8px;height:8px;border-radius:50%;background:var(--acc);flex-shrink:0}
.ig-promo-l small{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--acc);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:.2rem}
.ig-promo-l h4{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700}
.ig-promo-l p{font-size:.8rem;color:var(--t2)}
.btn-ig{display:inline-flex;align-items:center;gap:.4rem;background:rgba(225,48,108,.15);border:1px solid rgba(225,48,108,.3);color:#E1306C;padding:.55rem 1.1rem;border-radius:8px;font-size:.85rem;font-weight:600;transition:all .2s}
.btn-ig:hover{background:rgba(225,48,108,.25)}

/* FOOTER */
footer{background:rgba(0,0,0,.5);border-top:1px solid var(--br);padding:3.5rem 3rem 2rem}
.foot-wrap{max-width:1200px;margin:0 auto}
.foot-g{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:3rem;margin-bottom:2.5rem}
.flogo{display:flex;align-items:center;gap:.6rem;margin-bottom:.7rem}
.flogo-ico{width:30px;height:30px;border-radius:8px;background:var(--acc);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:900;font-size:.9rem;color:#fff}
.flogo-txt{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;color:var(--t1)}
.flogo-txt em{color:var(--acc)}
.fbrand p{color:var(--t2);font-size:.8rem;line-height:1.72;max-width:230px;margin-bottom:.5rem}
.fact{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--t3);display:flex;align-items:center;gap:.4rem}
.fact-dot{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.fcol h4{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);margin-bottom:.85rem;font-family:'JetBrains Mono',monospace}
.fcol ul{list-style:none;display:flex;flex-direction:column;gap:.45rem}
.fcol a{color:var(--t2);font-size:.82rem;transition:color .2s;display:flex;align-items:center;gap:.4rem}
.fcol a:hover{color:var(--t1)}
.foot-b{padding-top:1.4rem;border-top:1px solid var(--br);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.8rem}
.foot-b p{color:var(--t3);font-size:.72rem;font-family:'JetBrains Mono',monospace}
.foot-b em{color:var(--acc)}

/* FLOATING */
.fab-wa{position:fixed;bottom:2rem;right:2rem;z-index:150;width:52px;height:52px;border-radius:50%;background:#25D366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.4rem;box-shadow:0 4px 16px rgba(37,211,102,.4);transition:all .2s}
.fab-wa:hover{transform:scale(1.1);box-shadow:0 6px 26px rgba(37,211,102,.6)}
.sfab{position:fixed;bottom:2rem;left:2rem;z-index:150;width:52px;height:52px;border-radius:50%;background:var(--card2);border:1px solid var(--br);display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.4);transition:all .2s}
.sfab:hover{border-color:var(--acc);transform:scale(1.08)}
.sfab.on{background:var(--adim);border-color:var(--acc)}
.spanel{position:fixed;bottom:7rem;left:2rem;z-index:150;width:226px;background:var(--card);border:1px solid var(--br);border-radius:14px;padding:1.2rem;box-shadow:0 16px 50px rgba(0,0,0,.55);display:none}
.spanel.open{display:block}
.sphd{font-family:'Playfair Display',serif;font-weight:700;font-size:.9rem;display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem}
.sphd span{font-family:'JetBrains Mono',monospace;font-size:.63rem;font-weight:400;color:var(--t2)}
.sptimer{font-family:'Playfair Display',serif;font-size:2.6rem;font-weight:900;text-align:center;letter-spacing:-2px;color:var(--acc);margin-bottom:.8rem;line-height:1}
.spbtns{display:flex;gap:.5rem;margin-bottom:1rem}
.spbtn{flex:1;background:var(--card2);border:1px solid var(--br);color:var(--t2);font-size:.74rem;font-weight:600;cursor:pointer;border-radius:7px;padding:.48rem;transition:all .2s}
.spbtn:hover,.spbtn.on{background:var(--adim);border-color:var(--acc);color:var(--acc)}

/* FADE IN */
.fi{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s ease}
.fi.v{opacity:1;transform:none}

/* RESPONSIVE */
@media(max-width:960px){
  #nav{grid-template-columns:auto auto;padding:1rem 1.5rem}
  .nav-links{display:none}
  .burger{display:block}
  .mat-grid{grid-template-columns:1fr}
  .mat-row2{grid-template-columns:1fr 1fr}
  .mat-free-grid{grid-template-columns:1fr}
  .comm-grid{grid-template-columns:1fr 1fr}
  .test-grid{grid-template-columns:1fr}
  .foot-g{grid-template-columns:1fr 1fr}
  .stats-grid{grid-template-columns:1fr 1fr}
  .calc-wrap{grid-template-columns:1fr}
  .sec-split{flex-direction:column;gap:1rem}
  section{padding:4rem 1.5rem}
}
@media(max-width:560px){
  .mat-row2{grid-template-columns:1fr}
  .comm-grid{grid-template-columns:1fr}
  .foot-g{grid-template-columns:1fr;gap:2rem}
  .stats-grid{grid-template-columns:1fr 1fr}
  .hero-stats{flex-direction:column}
  .hs-item{border-right:none;border-bottom:1px solid var(--br);width:100%}
  .hs-item:last-child{border-bottom:none}
  .sfab,.spanel{display:none}
  footer{padding:3rem 1.5rem 2rem}
}

/* ── GRAY THEME ── */
html[data-theme="gray"]{
  --bg:#1a1b2e;--bg2:#16172a;--card:#21243d;--card2:#272b45;
  --t1:#e2e8f8;--t2:#7b88aa;--t3:#3a4468;
  --br:rgba(255,255,255,.08);
}
/* ── LIGHT THEME ── */
html[data-theme="light"]{
  --bg:#f5f7ff;--bg2:#eef0fa;--card:#ffffff;--card2:#f0f2fc;
  --t1:#0f172a;--t2:#4a5680;--t3:#9aa5c4;
  --br:rgba(0,0,0,.08);--bra:rgba(224,93,26,.3);
  --nav-bg:rgba(245,247,255,.75);
}
html[data-theme="light"] .ht-bot{background:linear-gradient(90deg,#0f172a 0%,#1e2d5a 35%,#e05d1a 75%,#ff8c42 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}


/* ── SETTINGS DROPDOWN ── */
.settings-wrap{position:relative}
.settings-btn{
  background:rgba(255,255,255,.06);border:1px solid var(--br);
  border-radius:8px;width:36px;height:36px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;font-size:1rem;transition:all .2s;
  color:var(--t2);
}
.settings-btn:hover{background:var(--adim);border-color:var(--bra);color:var(--t1)}
.settings-dropdown{
  position:absolute;top:calc(100% + 8px);right:0;z-index:300;
  background:var(--card);border:1px solid var(--br);border-radius:14px;
  padding:.85rem;width:200px;
  box-shadow:0 16px 40px rgba(0,0,0,.4);
  display:none;
}
.settings-dropdown.open{display:block}
.sd-label{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--t3);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem;display:block}
.sd-group{display:flex;gap:.35rem;margin-bottom:.9rem}
.sd-btn{
  flex:1;background:rgba(255,255,255,.04);border:1px solid var(--br);
  border-radius:7px;padding:.4rem .3rem;cursor:pointer;font-size:.72rem;
  font-weight:600;color:var(--t2);font-family:'JetBrains Mono',monospace;
  transition:all .2s;text-align:center;
}
.sd-btn:hover,.sd-btn.on{background:var(--adim);border-color:var(--bra);color:var(--t1)}
.sd-divider{height:1px;background:var(--br);margin:.4rem 0 .85rem}


/* SEMANA DEL PARCIAL */
.week-modal{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:1rem}
.week-modal.open{display:flex}
.wm-box{background:var(--card);border:1px solid var(--br);border-radius:20px;padding:2rem;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;position:relative}
.wm-close{position:absolute;top:1rem;right:1rem;background:none;border:none;color:var(--t2);font-size:1.2rem;cursor:pointer;transition:color .2s}
.wm-close:hover{color:var(--t1)}
.wm-box h3{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:900;margin-bottom:.3rem}
.wm-sub{color:var(--t2);font-size:.85rem;margin-bottom:1.5rem}
.wm-form{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-bottom:1.2rem}
.wm-field label{display:block;font-size:.72rem;color:var(--t3);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.3rem}
.wm-field select,.wm-field input{width:100%;background:var(--bg2);border:1px solid var(--br);border-radius:8px;padding:.55rem .8rem;color:var(--t1);font-size:.88rem;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
.wm-field select:focus,.wm-field input:focus{border-color:var(--bra)}
.wm-btn{width:100%;background:var(--acc);color:#fff;border:none;border-radius:10px;padding:.9rem;font-size:.95rem;font-weight:700;cursor:pointer;box-shadow:0 0 24px var(--aglow);transition:all .2s;font-family:'Inter',sans-serif}
.wm-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.plan-out{display:none;margin-top:1.2rem}
.plan-out.show{display:block}
.plan-day{background:var(--bg2);border:1px solid var(--br);border-radius:12px;padding:1rem;margin-bottom:.7rem}
.pd-header{display:flex;align-items:center;gap:.7rem;margin-bottom:.6rem}
.pd-num{width:28px;height:28px;border-radius:50%;background:var(--adim);border:1px solid var(--bra);color:var(--acc);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:700;flex-shrink:0}
.pd-day{font-weight:700;font-size:.9rem}
.pd-date{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--t3);margin-left:auto}
.pd-tasks{display:flex;flex-direction:column;gap:.35rem}
.pd-task{display:flex;align-items:flex-start;gap:.5rem;font-size:.8rem;color:var(--t2);line-height:1.5}
.pd-task::before{content:"→";color:var(--acc);flex-shrink:0;font-weight:700}
.pd-tag{font-family:'JetBrains Mono',monospace;font-size:.6rem;padding:.1rem .35rem;border-radius:3px;font-weight:600;margin-left:.3rem}
.pd-tag-sim{color:#60a5fa;background:rgba(96,165,250,.12)}
.pd-tag-form{color:var(--grn);background:rgba(34,197,94,.1)}
.pd-tag-rep{color:var(--yel);background:rgba(245,158,11,.1)}


/* ── CALCULADORA PROMEDIO PONDERADO ── */
.prom-s{background:var(--bg)}
.prom-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:3rem;align-items:start}
.prom-table-wrap{background:var(--card);border:1px solid var(--br);border-radius:14px;overflow:hidden}
.prom-thead{display:grid;grid-template-columns:1fr 80px 90px 44px;gap:0;padding:.65rem 1rem;background:rgba(255,255,255,.04);border-bottom:1px solid var(--br)}
.prom-thead span{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
.prom-rows{display:flex;flex-direction:column}
.prom-row{display:grid;grid-template-columns:1fr 80px 90px 44px;gap:0;padding:.5rem 1rem;border-bottom:1px solid var(--br);align-items:center;transition:background .2s}
.prom-row:last-child{border:none}
.prom-row:hover{background:rgba(255,255,255,.02)}
.prom-inp{background:transparent;border:1px solid transparent;border-radius:6px;padding:.3rem .5rem;color:var(--t1);font-size:.84rem;font-family:'Inter',sans-serif;outline:none;width:100%;transition:all .2s}
.prom-inp:focus{background:var(--bg2);border-color:var(--bra)}
.prom-inp::placeholder{color:var(--t3)}
.prom-del{background:none;border:none;color:var(--t3);cursor:pointer;font-size:1rem;padding:.2rem .4rem;border-radius:5px;transition:color .2s}
.prom-del:hover{color:var(--red)}
.prom-add-row{display:flex;padding:.6rem 1rem;border-top:1px solid var(--br)}
.prom-add-btn{background:none;border:1px dashed var(--br);border-radius:7px;color:var(--t3);font-size:.8rem;font-weight:500;cursor:pointer;padding:.4rem .8rem;width:100%;transition:all .2s;font-family:'Inter',sans-serif}
.prom-add-btn:hover{border-color:var(--bra);color:var(--acc)}
.prom-result-card{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:1.8rem;position:sticky;top:90px}
.prom-nota-big{font-family:'Playfair Display',serif;font-size:4rem;font-weight:900;letter-spacing:-3px;line-height:1;display:block;transition:color .5s}
.prom-status{font-size:.78rem;font-weight:600;padding:.22rem .6rem;border-radius:6px;font-family:'JetBrains Mono',monospace;display:inline-block;margin-top:.3rem;margin-bottom:1rem}
.ps-green{color:var(--grn);background:rgba(34,197,94,.1)}
.ps-yellow{color:var(--yel);background:rgba(245,158,11,.1)}
.ps-red{color:var(--red);background:rgba(248,113,113,.1)}
.prom-stats{display:flex;flex-direction:column;gap:.55rem;margin-top:1rem}
.ps-row{display:flex;justify-content:space-between;font-size:.82rem;padding:.4rem 0;border-bottom:1px solid var(--br)}
.ps-row:last-child{border:none}
.ps-row span:first-child{color:var(--t2)}
.ps-row strong{font-family:'JetBrains Mono',monospace;color:var(--t1)}
.prom-bar-wrap{margin-top:1rem}
.prom-bar-label{font-size:.65rem;color:var(--t3);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.4rem;display:flex;justify-content:space-between}
.prom-bar{height:8px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;margin-bottom:.6rem}
.prom-bar-fill{height:100%;border-radius:99px;transition:width .5s ease,background .5s ease}
.prom-hint{font-size:.75rem;color:var(--t3);line-height:1.6;margin-top:1rem;font-family:'JetBrains Mono',monospace}
.prom-hint em{color:var(--acc);font-style:normal}

  
/* ══ simulacro ══ */

:root{
  --bg:#090c18;--bg2:#0d1023;--card:#111628;--card2:#161d32;
  --acc:#e05d1a;--adim:rgba(224,93,26,.12);--aglow:rgba(224,93,26,.25);
  --grn:#22c55e;--yel:#f59e0b;--red:#f87171;--blue:#60a5fa;
  --t1:#eef2ff;--t2:#6b7a9a;--t3:#2a3354;
  --br:rgba(255,255,255,.07);--bra:rgba(224,93,26,.35);
  --nav-bg:rgba(9,12,24,.65);
}
html[data-theme="gray"]{--bg:#1a1b2e;--bg2:#16172a;--card:#21243d;--card2:#272b45;--t1:#e2e8f8;--t2:#7b88aa;--t3:#3a4468;--br:rgba(255,255,255,.08);--nav-bg:rgba(26,27,46,.72)}
html[data-theme="light"]{--bg:#f5f7ff;--bg2:#eef0fa;--card:#fff;--card2:#f0f2fc;--t1:#0f172a;--t2:#4a5680;--t3:#9aa5c4;--br:rgba(0,0,0,.08);--bra:rgba(224,93,26,.3);--nav-bg:rgba(245,247,255,.78)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}

/* NAV */
nav{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:.9rem 2rem;
  background:var(--nav-bg);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  border-bottom:1px solid var(--br);
}
.logo{display:flex;align-items:center;gap:.55rem}
.logo-ico{width:32px;height:32px;border-radius:8px;background:var(--acc);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:900;font-size:.95rem;color:#fff}
.logo-txt{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700}
.logo-txt em{color:var(--acc);font-style:normal}
.nav-r{display:flex;align-items:center;gap:.4rem}
.ctrl-btn{background:rgba(255,255,255,.05);border:1px solid var(--br);border-radius:6px;padding:.28rem .52rem;cursor:pointer;font-size:.7rem;font-weight:600;color:var(--t2);font-family:'JetBrains Mono',monospace;transition:all .2s;line-height:1}
.ctrl-btn:hover,.ctrl-btn.on{background:var(--adim);border-color:var(--bra);color:var(--t1)}
.ctrl-sep{width:1px;height:14px;background:var(--br);margin:0 .15rem;display:inline-block}

/* TIMER */
.timer-bar{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:.6rem 2rem;background:var(--bg2);border-bottom:1px solid var(--br);
  flex-wrap:wrap;
}
.timer-info{display:flex;align-items:center;gap:1rem}
.timer-label{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--t3);text-transform:uppercase;letter-spacing:.08em}
.timer-display{
  font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:900;
  color:var(--acc);letter-spacing:-1px;min-width:80px;
  transition:color .3s;
}
.timer-display.warn{color:var(--yel)}
.timer-display.danger{color:var(--red);animation:pulse .8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.timer-controls{display:flex;gap:.5rem}
.tbtn{
  background:rgba(255,255,255,.05);border:1px solid var(--br);
  border-radius:7px;padding:.38rem .85rem;cursor:pointer;
  font-size:.78rem;font-weight:600;color:var(--t2);
  font-family:'Inter',sans-serif;transition:all .2s;
}
.tbtn:hover{background:var(--adim);border-color:var(--bra);color:var(--t1)}
.progress-wrap{display:flex;align-items:center;gap:.7rem;font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--t2)}
.progress-bar{width:140px;height:5px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--acc),#ff8c42);border-radius:99px;transition:width .4s ease}


/* OPEN QUESTIONS */
.q-open-area{
  background:rgba(255,255,255,.03);border:1.5px solid var(--br);
  border-radius:12px;padding:1rem;margin-bottom:1rem;
}
.q-open-label{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--acc);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:.6rem;display:block}
.q-textarea{
  width:100%;min-height:120px;background:transparent;border:none;
  color:var(--t1);font-family:'Inter',sans-serif;font-size:.9rem;
  line-height:1.7;resize:vertical;outline:none;
}
.q-textarea::placeholder{color:var(--t3)}
.q-textarea:disabled{opacity:.6}
.sol-card{
  background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.2);
  border-radius:12px;padding:1.3rem;margin-top:1rem;display:none;
}
.sol-card.show{display:block}
.sol-card-hd{font-family:'Playfair Display',serif;font-weight:700;font-size:.95rem;
  color:var(--grn);margin-bottom:.9rem;display:flex;align-items:center;gap:.5rem}
.self-eval{
  background:var(--bg2);border:1px solid var(--br);border-radius:10px;
  padding:1rem;margin-top:1rem;display:none;
}
.self-eval.show{display:block}
.self-eval-lbl{font-size:.82rem;color:var(--t2);margin-bottom:.7rem;font-weight:500}
.self-btns{display:flex;gap:.6rem}
.sbtn-yes{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:var(--grn);
  border-radius:8px;padding:.55rem 1.2rem;font-size:.85rem;font-weight:700;cursor:pointer;
  font-family:'Inter',sans-serif;transition:all .2s}
.sbtn-yes:hover{background:rgba(34,197,94,.25)}
.sbtn-no{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.25);color:var(--red);
  border-radius:8px;padding:.55rem 1.2rem;font-size:.85rem;font-weight:700;cursor:pointer;
  font-family:'Inter',sans-serif;transition:all .2s}
.sbtn-no:hover{background:rgba(248,113,113,.18)}
.q-tipo-badge{display:inline-flex;align-items:center;gap:.3rem;font-family:'JetBrains Mono',monospace;
  font-size:.6rem;text-transform:uppercase;letter-spacing:.07em;padding:.18rem .5rem;
  border-radius:4px;margin-bottom:.8rem}
.badge-mcq{color:var(--blue);background:rgba(96,165,250,.1)}
.badge-open{color:var(--yel);background:rgba(245,158,11,.1)}

/* SCREENS */
.screen{display:none;max-width:820px;margin:0 auto;padding:2rem 1.5rem}
.screen.active{display:block}

/* INTRO SCREEN */
.intro-card{background:var(--card);border:1px solid var(--br);border-radius:18px;padding:2.5rem;text-align:center;margin-bottom:1.5rem}
.intro-badge{display:inline-flex;align-items:center;gap:.4rem;background:var(--adim);border:1px solid var(--bra);border-radius:999px;padding:.28rem .85rem;font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--acc);text-transform:uppercase;letter-spacing:.08em;margin-bottom:1.2rem}
.intro-title{font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:900;margin-bottom:.5rem;line-height:1.1}
.intro-sub{color:var(--t2);font-size:.93rem;line-height:1.7;margin-bottom:2rem}
.intro-stats{display:flex;justify-content:center;gap:0;border:1px solid var(--br);border-radius:12px;overflow:hidden;margin-bottom:2rem}
.is{flex:1;padding:.9rem 1rem;text-align:center;border-right:1px solid var(--br)}
.is:last-child{border-right:none}
.is-n{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:900;color:var(--acc);display:block;line-height:1}
.is-l{font-size:.62rem;color:var(--t2);text-transform:uppercase;letter-spacing:.07em;font-family:'JetBrains Mono',monospace;margin-top:.2rem;display:block}
.intro-rules{background:var(--bg2);border-radius:12px;padding:1.2rem 1.5rem;text-align:left;margin-bottom:1.8rem}
.intro-rules h4{font-size:.82rem;font-weight:700;margin-bottom:.7rem;color:var(--t1)}
.intro-rules li{font-size:.82rem;color:var(--t2);line-height:1.9;list-style:none;display:flex;align-items:flex-start;gap:.5rem}
.intro-rules li::before{content:"→";color:var(--acc);flex-shrink:0;font-weight:700}
.btn-start{display:inline-flex;align-items:center;gap:.5rem;background:var(--acc);color:#fff;border:none;border-radius:10px;padding:1rem 2.5rem;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 0 28px var(--aglow);transition:all .2s;font-family:'Inter',sans-serif}
.btn-start:hover{filter:brightness(1.1);transform:translateY(-2px)}

/* QUESTION SCREEN */
.q-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:.5rem}
.q-counter{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--t3);text-transform:uppercase;letter-spacing:.08em}
.q-card{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:2rem;margin-bottom:1rem}
.q-text{font-size:1.05rem;line-height:1.8;margin-bottom:1.8rem;color:var(--t1)}
.q-text .katex-display{margin:.8rem 0}
.q-options{display:flex;flex-direction:column;gap:.6rem}
.q-opt{
  display:flex;align-items:center;gap:1rem;
  background:rgba(255,255,255,.03);border:1.5px solid var(--br);
  border-radius:11px;padding:.95rem 1.1rem;cursor:pointer;
  transition:all .2s;font-size:.93rem;
}
.q-opt:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15)}
.q-opt.selected{background:var(--adim);border-color:var(--bra);color:var(--t1)}
.q-opt.correct{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.4);color:var(--grn)}
.q-opt.wrong{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.35);color:var(--red)}
.q-opt-letter{
  width:28px;height:28px;border-radius:50%;
  background:rgba(255,255,255,.07);border:1px solid var(--br);
  display:flex;align-items:center;justify-content:center;
  font-family:'Playfair Display',serif;font-weight:700;font-size:.82rem;
  flex-shrink:0;transition:all .2s;
}
.q-opt.selected .q-opt-letter{background:var(--acc);border-color:var(--acc);color:#fff}
.q-opt.correct .q-opt-letter{background:var(--grn);border-color:var(--grn);color:#fff}
.q-opt.wrong .q-opt-letter{background:var(--red);border-color:var(--red);color:#fff}
.q-opt-text{flex:1;line-height:1.5}

/* EXPLANATION CARD */
.expl-card{
  background:var(--bg2);border:1px solid var(--br);border-radius:14px;
  padding:1.5rem;margin-top:1rem;display:none;
}
.expl-card.show{display:block}
.expl-result{display:flex;align-items:center;gap:.6rem;margin-bottom:1rem;font-weight:700;font-size:.95rem}
.expl-result.correct-r{color:var(--grn)}
.expl-result.wrong-r{color:var(--red)}
.expl-steps{display:flex;flex-direction:column;gap:.7rem;margin-top:1rem}
.expl-step{
  display:flex;align-items:flex-start;gap:.8rem;
  background:rgba(255,255,255,.03);border:1px solid var(--br);
  border-radius:10px;padding:.85rem 1rem;
}
.step-n{
  width:24px;height:24px;border-radius:50%;
  background:var(--adim);border:1px solid var(--bra);
  color:var(--acc);display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:700;
  flex-shrink:0;margin-top:.1rem;
}
.step-txt{font-size:.85rem;color:var(--t2);line-height:1.7}
.step-txt .katex{font-size:.9rem}

/* NAV BUTTONS */
.q-nav{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-top:1rem}
.qbtn{
  display:flex;align-items:center;gap:.4rem;
  background:rgba(255,255,255,.05);border:1px solid var(--br);
  border-radius:9px;padding:.7rem 1.3rem;cursor:pointer;
  font-size:.88rem;font-weight:600;color:var(--t2);
  font-family:'Inter',sans-serif;transition:all .2s;
}
.qbtn:hover{background:rgba(255,255,255,.09);color:var(--t1)}
.qbtn:disabled{opacity:.3;cursor:default}
.qbtn.primary{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 0 18px var(--aglow)}
.qbtn.primary:hover{filter:brightness(1.1)}
.qbtn.submit{background:var(--grn);color:#fff;border-color:var(--grn);box-shadow:0 0 18px rgba(34,197,94,.3)}
.qbtn.submit:hover{filter:brightness(1.1)}


/* SHARE CARD */
.share-card-wrap{
  background:linear-gradient(135deg,var(--card) 0%,var(--card2) 100%);
  border:1px solid var(--bra);border-radius:16px;padding:1.8rem;
  text-align:center;margin:1.2rem 0;position:relative;overflow:hidden;
}
.share-card-wrap::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--acc),#ff8c42)}
.sc-materia{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--acc);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.3rem}
.sc-title{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;margin-bottom:.2rem}
.sc-nota-big{font-family:'Playfair Display',serif;font-size:3.5rem;font-weight:900;letter-spacing:-3px;display:block;line-height:1;margin:.6rem 0}
.sc-label{font-size:.72rem;color:var(--t2);font-family:'JetBrains Mono',monospace;margin-bottom:.8rem;display:block}
.sc-stats{display:flex;justify-content:center;gap:1.5rem;margin-bottom:1rem}
.sc-stat{text-align:center}
.sc-stat-n{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:900;display:block;line-height:1}
.sc-stat-l{font-size:.6rem;color:var(--t2);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.06em}
.sc-tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.6rem;padding:.14rem .5rem;border-radius:4px;margin-bottom:.8rem}
.sc-brand{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--t3);margin-top:.5rem}
.sc-brand em{color:var(--acc);font-style:normal}
.share-btns-row{display:flex;gap:.6rem;justify-content:center;margin-top:1rem;flex-wrap:wrap}
.shr-btn{display:flex;align-items:center;gap:.4rem;padding:.55rem 1rem;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;border:none;font-family:'Inter',sans-serif;transition:all .2s}
.shr-wa{background:rgba(37,211,102,.15);color:#25D366;border:1px solid rgba(37,211,102,.25)}
.shr-wa:hover{background:rgba(37,211,102,.25)}
.shr-copy{background:rgba(255,255,255,.06);color:var(--t2);border:1px solid var(--br)}
.shr-copy:hover{background:rgba(255,255,255,.1);color:var(--t1)}
.shr-ig{background:rgba(225,48,108,.1);color:#E1306C;border:1px solid rgba(225,48,108,.2)}
.shr-ig:hover{background:rgba(225,48,108,.2)}

/* RESULTS SCREEN */
.results-header{text-align:center;padding:2rem 0 1.5rem}
.score-ring{width:140px;height:140px;margin:0 auto 1.2rem;position:relative}
.score-ring svg{transform:rotate(-90deg)}
.score-ring-bg{fill:none;stroke:rgba(255,255,255,.07);stroke-width:10}
.score-ring-fill{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1.5s ease}
.score-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-pct{font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;line-height:1}
.score-label{font-size:.62rem;color:var(--t2);text-transform:uppercase;letter-spacing:.08em;font-family:'JetBrains Mono',monospace;margin-top:.2rem}
.results-title{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:900;margin-bottom:.4rem}
.results-sub{color:var(--t2);font-size:.88rem;margin-bottom:1.5rem}
.results-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-bottom:2rem}
.rg-card{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:1rem;text-align:center}
.rg-n{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:900;line-height:1;margin-bottom:.2rem}
.rg-l{font-size:.65rem;color:var(--t2);text-transform:uppercase;letter-spacing:.07em;font-family:'JetBrains Mono',monospace}
.review-title{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;margin-bottom:1rem}
.review-item{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:1.2rem;margin-bottom:.8rem}
.ri-top{display:flex;align-items:center;gap:.7rem;margin-bottom:.5rem}
.ri-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:700;flex-shrink:0}
.ri-correct .ri-num{background:rgba(34,197,94,.15);color:var(--grn)}
.ri-wrong .ri-num{background:rgba(248,113,113,.12);color:var(--red)}
.ri-q{font-size:.85rem;font-weight:600}
.ri-ans{font-size:.78rem;color:var(--t2);margin-left:2.3rem}
.ri-ans em{color:var(--grn);font-style:normal;font-weight:600}
.ri-ans span{color:var(--red)}
.results-btns{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;margin-top:1.5rem}

.nav-r a{color:var(--t2);font-size:.85rem;font-weight:500;transition:color .2s}
.nav-r a:hover{color:var(--t1)}

  transition:all .2s;white-space:nowrap;

.ctrl-btn-old:hover{background:var(--adim);border-color:var(--bra);color:var(--t1)}
.theme-grp{display:flex;gap:.25rem}

/* BREADCRUMB */
.breadcrumb{
  max-width:1200px;margin:0 auto;
  padding:1.2rem 2.5rem .5rem;

}

.bc-sep{margin:0 .15rem;color:var(--t3)}

/* SUBJECT HEADER */
.subj-header{max-width:1200px;margin:0 auto;padding:1.5rem 2.5rem 3rem;border-bottom:1px solid var(--br)}
.subj-badges{display:flex;align-items:center;gap:.45rem;margin-bottom:1.1rem;flex-wrap:wrap}
.sbadge{font-family:'JetBrains Mono',monospace;font-size:.63rem;font-weight:600;padding:.18rem .52rem;border-radius:4px;letter-spacing:.04em}
.sb-code{color:var(--t3);background:rgba(255,255,255,.05);border:1px solid var(--br)}
.sb-sem{color:var(--t2);background:rgba(255,255,255,.05);border:1px solid var(--br)}
.sb-hot{color:var(--acc);background:var(--adim);border:1px solid var(--bra)}
.diff-b{color:var(--grn);background:rgba(34,197,94,.1)}
.diff-m{color:var(--yel);background:rgba(245,158,11,.1)}
.diff-h{color:#fb923c;background:rgba(251,146,60,.1)}
.diff-x{color:var(--red);background:rgba(248,113,113,.1)}
.subj-title{
  font-family:'Playfair Display',serif;font-weight:900;

  letter-spacing:-.5px;line-height:1.05;margin-bottom:.8rem;
}
.subj-desc{color:var(--t2);font-size:.97rem;line-height:1.72;max-width:620px;margin-bottom:1.4rem}
.subj-stats{display:flex;gap:2rem;flex-wrap:wrap}
.ss-item{display:flex;align-items:center;gap:.45rem;font-family:'JetBrains Mono',monospace;font-size:.73rem;color:var(--t3)}
.ss-item strong{color:var(--acc)}

/* CONTENT */
.content-wrap{max-width:1200px;margin:0 auto;padding:2.5rem 2.5rem;display:grid;grid-template-columns:1fr 330px;gap:2.5rem;align-items:start}
.mat-tabs{display:flex;gap:.35rem;margin-bottom:1.8rem;background:var(--bg2);border:1px solid var(--br);border-radius:12px;padding:.3rem;width:fit-content;flex-wrap:wrap}
.mat-tab{background:none;border:none;cursor:pointer;color:var(--t2);font-size:.8rem;font-weight:600;font-family:'Inter',sans-serif;padding:.48rem .95rem;border-radius:8px;transition:all .2s;white-space:nowrap}
.mat-tab:hover{color:var(--t1)}
.mat-tab.on{background:var(--card2);color:var(--t1);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.mat-tab .cnt{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--acc);margin-left:.22rem}
.sem-group{margin-bottom:2rem}
.sem-label{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.7rem;padding-bottom:.45rem;border-bottom:1px solid var(--br)}
.mat-item{display:flex;align-items:center;gap:.85rem;padding:.85rem 1rem;background:var(--card);border:1px solid var(--br);border-radius:10px;margin-bottom:.45rem;transition:all .2s;cursor:pointer}
.mat-item:hover{background:var(--card2);border-color:rgba(255,255,255,.12)}
.mi-ico{width:36px;height:36px;background:var(--adim);border:1px solid var(--bra);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0}
.mi-info{flex:1;min-width:0}
.mi-info h4{font-size:.88rem;font-weight:600;margin-bottom:.08rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi-info p{font-size:.72rem;color:var(--t2)}
.mi-size{font-family:'JetBrains Mono',monospace;font-size:.63rem;color:var(--t3);white-space:nowrap;flex-shrink:0}
.mi-dl{display:flex;align-items:center;gap:.3rem;background:var(--acc);color:#fff;font-size:.74rem;font-weight:700;padding:.35rem .7rem;border-radius:6px;flex-shrink:0;transition:filter .2s;white-space:nowrap}
.mi-dl:hover{filter:brightness(1.12)}
.mat-item.locked{opacity:.5;cursor:default}
.mat-item.locked:hover{background:var(--card);border-color:var(--br)}
.mi-lock{font-size:.74rem;color:var(--t3);padding:.35rem .7rem;border-radius:6px;background:rgba(255,255,255,.04);border:1px solid var(--br);flex-shrink:0;white-space:nowrap}
.empty-state{text-align:center;padding:3rem;color:var(--t3);font-size:.9rem}

/* PREMIUM CARD */
.prem-sticky{position:sticky;top:80px}
.prem{background:var(--card);border:1.5px solid var(--bra);border-radius:16px;padding:1.7rem;position:relative;overflow:hidden;margin-bottom:1.4rem}
.prem::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent)}
.pg{position:absolute;top:-50px;right:-50px;width:160px;height:160px;background:radial-gradient(circle,rgba(224,93,26,.12),transparent 65%);pointer-events:none}
.prem>*:not(.pg){position:relative;z-index:1}
.pbadge{display:inline-flex;align-items:center;gap:.28rem;background:var(--acc);color:#fff;font-family:'JetBrains Mono',monospace;font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .65rem;border-radius:4px;margin-bottom:.9rem}
.prem h3{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;margin-bottom:.3rem}
.prem .pdesc{color:var(--t2);font-size:.82rem;line-height:1.6;margin-bottom:1.2rem}
.lock-list{margin-bottom:1.1rem}
.lock-row{display:flex;align-items:center;gap:.65rem;padding:.52rem .65rem;background:rgba(255,255,255,.04);border-radius:7px;margin-bottom:.32rem;font-size:.78rem;color:var(--t2)}
.lock-row strong{color:var(--t1);font-weight:600}
.price-row{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:9px;padding:.75rem .9rem;margin-bottom:.9rem}
.pl{font-family:'JetBrains Mono',monospace;font-size:.58rem;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:.1rem}
.pb{font-family:'Playfair Display',serif;font-size:1.75rem;font-weight:900;color:var(--acc);line-height:1}
.pb s{font-size:.78rem;font-weight:400;color:var(--t3);margin-left:.28rem}
.pr{text-align:right;font-size:.7rem;color:var(--t2);line-height:1.55}
.pr .sv{color:var(--grn);font-weight:700}
.btn-buy{display:flex;align-items:center;justify-content:center;gap:.4rem;width:100%;background:var(--acc);color:#fff;border:none;border-radius:9px;padding:.88rem;font-size:.9rem;font-weight:700;cursor:pointer;box-shadow:0 4px 18px var(--aglow);transition:all .2s;text-decoration:none;font-family:'Inter',sans-serif}
.btn-buy:hover{filter:brightness(1.1);transform:translateY(-2px)}
.secure{text-align:center;font-size:.67rem;color:var(--t3);margin-top:.45rem;font-family:'JetBrains Mono',monospace}
.share-card{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:1.2rem}
.share-card h4{font-family:'Playfair Display',serif;font-size:.95rem;font-weight:700;margin-bottom:.75rem}
.share-btns{display:flex;gap:.45rem;flex-direction:column}
.share-btn{display:flex;align-items:center;gap:.6rem;padding:.6rem .9rem;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s;border:none;font-family:'Inter',sans-serif}
.sh-wa{background:rgba(37,211,102,.12);color:#25D366;border:1px solid rgba(37,211,102,.2)}
.sh-wa:hover{background:rgba(37,211,102,.22)}
.sh-copy{background:rgba(255,255,255,.05);color:var(--t2);border:1px solid var(--br)}
.sh-copy:hover{background:rgba(255,255,255,.09);color:var(--t1)}

/* RELATED */
.related-wrap{max-width:1200px;margin:0 auto;padding:3rem 2.5rem;border-top:1px solid var(--br)}
.related-wrap h2{font-family:'Playfair Display',serif;font-size:1.7rem;font-weight:700;letter-spacing:-.3px;margin-bottom:1.4rem}
.related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.rc{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:1.3rem;transition:border-color .2s,transform .2s;cursor:pointer}
.rc:hover{border-color:var(--bra);transform:translateY(-3px)}
.rc-sem{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--t3);margin-bottom:.4rem;display:block}
.rc-title{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;margin-bottom:.5rem}
.rc-pdfs{font-size:.75rem;color:var(--t2)}
.rc-arr{float:right;color:var(--t3);transition:all .3s}
.rc:hover .rc-arr{color:var(--acc);transform:translateX(3px)}

/* FOOTER */
footer{background:rgba(0,0,0,.35);border-top:1px solid var(--br);padding:2rem 2.5rem;text-align:center}
footer p{color:var(--t3);font-size:.72rem;font-family:'JetBrains Mono',monospace}
footer em{color:var(--acc)}

/* FADE-IN */
.fi{opacity:0;transform:translateY(12px);transition:opacity .5s ease,transform .5s ease}
.fi.v{opacity:1;transform:none}

/* RESPONSIVE */
@media(max-width:860px){
  .content-wrap{grid-template-columns:1fr;padding:2rem 1.5rem}
  .prem-sticky{position:static}
  .related-grid{grid-template-columns:1fr 1fr}
  .nav-r a:not(.nav-cta){display:none}
  .subj-header,.breadcrumb,.related-wrap{padding-left:1.5rem;padding-right:1.5rem}
}
@media(max-width:560px){
  .related-grid{grid-template-columns:1fr}
  .mat-tabs{width:100%;overflow-x:auto;flex-wrap:nowrap}
  .mat-tab{flex-shrink:0}
  .theme-grp .ctrl-btn span{display:none}
  #nav{padding:.9rem 1.2rem}
}

/* ── SETTINGS DROPDOWN ── */
.settings-wrap{position:relative}
.settings-btn{
  background:rgba(255,255,255,.06);border:1px solid var(--br);
  border-radius:8px;width:36px;height:36px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;font-size:1rem;transition:all .2s;
  color:var(--t2);
}
.settings-btn:hover{background:var(--adim);border-color:var(--bra);color:var(--t1)}
.settings-dropdown{
  position:absolute;top:calc(100% + 8px);right:0;z-index:300;
  background:var(--card);border:1px solid var(--br);border-radius:14px;
  padding:.85rem;width:200px;
  box-shadow:0 16px 40px rgba(0,0,0,.4);
  display:none;
}
.settings-dropdown.open{display:block}
.sd-label{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--t3);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem;display:block}
.sd-group{display:flex;gap:.35rem;margin-bottom:.9rem}
.sd-btn{
  flex:1;background:rgba(255,255,255,.04);border:1px solid var(--br);
  border-radius:7px;padding:.4rem .3rem;cursor:pointer;font-size:.72rem;
  font-weight:600;color:var(--t2);font-family:'JetBrains Mono',monospace;
  transition:all .2s;text-align:center;
}
.sd-btn:hover,.sd-btn.on{background:var(--adim);border-color:var(--bra);color:var(--t1)}
.sd-divider{height:1px;background:var(--br);margin:.4rem 0 .85rem}

  
/* ══ formulas ══ */

:root{--bg:#090c18;--bg2:#0d1023;--card:#111628;--card2:#161d32;--acc:#e05d1a;--adim:rgba(224,93,26,.12);--aglow:rgba(224,93,26,.25);--grn:#22c55e;--yel:#f59e0b;--t1:#eef2ff;--t2:#6b7a9a;--t3:#2a3354;--br:rgba(255,255,255,.07);--bra:rgba(224,93,26,.35);--nav-bg:rgba(9,12,24,.65)}
html[data-theme="gray"]{--bg:#1a1b2e;--bg2:#16172a;--card:#21243d;--card2:#272b45;--t1:#e2e8f8;--t2:#7b88aa;--t3:#3a4468;--br:rgba(255,255,255,.08);--nav-bg:rgba(26,27,46,.72)}
html[data-theme="light"]{--bg:#f5f7ff;--bg2:#eef0fa;--card:#fff;--card2:#f0f2fc;--t1:#0f172a;--t2:#4a5680;--t3:#9aa5c4;--br:rgba(0,0,0,.08);--bra:rgba(224,93,26,.3);--nav-bg:rgba(245,247,255,.78)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--t1);transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:.9rem 2rem;background:var(--nav-bg);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-bottom:1px solid var(--br)}
.logo{display:flex;align-items:center;gap:.55rem}
.logo-ico{width:32px;height:32px;border-radius:8px;background:var(--acc);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:900;font-size:.95rem;color:#fff}
.logo-txt{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700}
.logo-txt em{color:var(--acc);font-style:normal}
.nav-r{display:flex;align-items:center;gap:.5rem}

/* SETTINGS */
.settings-wrap{position:relative}
.settings-btn{background:rgba(255,255,255,.06);border:1px solid var(--br);border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;transition:all .2s;color:var(--t2)}
.settings-btn:hover{background:var(--adim);border-color:var(--bra)}
.settings-dropdown{position:absolute;top:calc(100% + 8px);right:0;z-index:300;background:var(--card);border:1px solid var(--br);border-radius:14px;padding:.85rem;width:200px;box-shadow:0 16px 40px rgba(0,0,0,.4);display:none}
.settings-dropdown.open{display:block}
.sd-label{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem;display:block}
.sd-group{display:flex;gap:.35rem;margin-bottom:.9rem}
.sd-btn{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--br);border-radius:7px;padding:.4rem .3rem;cursor:pointer;font-size:.72rem;font-weight:600;color:var(--t2);font-family:'JetBrains Mono',monospace;transition:all .2s;text-align:center}
.sd-btn:hover,.sd-btn.on{background:var(--adim);border-color:var(--bra);color:var(--t1)}
.sd-divider{height:1px;background:var(--br);margin:.4rem 0 .85rem}
.print-btn{display:flex;align-items:center;gap:.4rem;background:var(--acc);color:#fff;border:none;border-radius:8px;padding:.45rem 1rem;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif}
.print-btn:hover{filter:brightness(1.1)}

/* PAGE */
.page{max-width:1100px;margin:0 auto;padding:2.5rem 1.5rem}
.page-header{margin-bottom:2rem}
.page-header h1{font-family:'Playfair Display',serif;font-size:2.2rem;font-weight:900;letter-spacing:-.5px;margin-bottom:.4rem}
.page-header p{color:var(--t2);font-size:.95rem}

/* SEARCH + FILTERS */
.controls{display:flex;align-items:center;gap:.8rem;margin-bottom:1.8rem;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:200px}
.search-ico{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--t3);font-size:.9rem;pointer-events:none}
.search-inp{width:100%;background:var(--card);border:1px solid var(--br);border-radius:10px;padding:.65rem .9rem .65rem 2.4rem;color:var(--t1);font-size:.88rem;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
.search-inp:focus{border-color:var(--bra)}
.search-inp::placeholder{color:var(--t3)}
.filters{display:flex;gap:.4rem;flex-wrap:wrap}
.filter-btn{background:rgba(255,255,255,.04);border:1px solid var(--br);border-radius:999px;padding:.35rem .9rem;cursor:pointer;font-size:.78rem;font-weight:500;color:var(--t2);transition:all .2s;white-space:nowrap}
.filter-btn:hover,.filter-btn.on{background:var(--adim);border-color:var(--bra);color:var(--t1)}

/* CARDS GRID */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}
.fcard{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:1.3rem;transition:border-color .2s,transform .2s;display:flex;flex-direction:column;gap:.7rem}
.fcard:hover{border-color:var(--bra);transform:translateY(-2px)}
.fcard-top{display:flex;align-items:center;justify-content:space-between}
.fcard-tag{font-family:'JetBrains Mono',monospace;font-size:.6rem;text-transform:uppercase;letter-spacing:.07em;padding:.15rem .45rem;border-radius:4px;font-weight:600}
.tag-lim{color:#60a5fa;background:rgba(96,165,250,.12)}
.tag-der{color:var(--acc);background:var(--adim)}
.tag-int{color:var(--grn);background:rgba(34,197,94,.1)}
.tag-alg{color:var(--yel);background:rgba(245,158,11,.1)}
.tag-edo{color:#a78bfa;background:rgba(167,139,250,.1)}
.tag-tri{color:#f472b6;background:rgba(244,114,182,.1)}
.tag-ser{color:#34d399;background:rgba(52,211,153,.1)}
.fcard-name{font-family:'Playfair Display',serif;font-weight:700;font-size:1rem;line-height:1.2}
.fcard-formula{background:var(--bg2);border-radius:9px;padding:.9rem;text-align:center;min-height:52px;display:flex;align-items:center;justify-content:center}
.fcard-formula .katex-display{margin:0}
.fcard-desc{font-size:.78rem;color:var(--t2);line-height:1.6}
.fcard-tip{font-size:.72rem;color:var(--acc);font-family:'JetBrains Mono',monospace;border-top:1px solid var(--br);padding-top:.6rem;margin-top:.2rem}

/* PRINT */
@media print{
  nav,#no-print{display:none!important}
  body{background:#fff!important;color:#000!important}
  .fcard{border:1px solid #ccc!important;background:#fff!important;break-inside:avoid;transform:none!important}
  .fcard-formula{background:#f5f5f5!important}
  .cards-grid{grid-template-columns:repeat(3,1fr)!important;gap:.6rem!important}
  .page{padding:1rem!important}
}

@media(max-width:600px){.cards-grid{grid-template-columns:1fr}}

.nav-r a{color:var(--t2);font-size:.85rem;font-weight:500;transition:color .2s}
.nav-r a:hover{color:var(--t1)}
  
/* SPA extras */
#mu-app { min-height: 100vh; }
/* Estado Premium */
html.is-premium .lock-row { opacity: 1; }
html.is-premium .prem-card::before { content:'✓ PREMIUM ACTIVO'; position:absolute; top:10px; right:12px; z-index:5; font-family:'JetBrains Mono',monospace; font-size:.6rem; letter-spacing:.08em; color:#fff; background:var(--grn,#16a34a); padding:.25rem .6rem; border-radius:999px; }
/* Accesibilidad */
.mu-skip { position:absolute; left:-999px; top:0; z-index:9999; background:var(--acc); color:#fff; padding:.6rem 1rem; border-radius:0 0 8px 0; font-weight:600; }
.mu-skip:focus { left:0; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--acc); outline-offset:2px; border-radius:4px; }
  </style>

function calcResult(needed,vId,mId){
  var v=document.getElementById(vId),m=document.getElementById(mId);
  if(!v||!m)return;
  if(needed===null){v.textContent='—';v.className='cr-value';m.textContent='Ingresa los datos para calcular';return;}
  if(needed<=0){v.textContent='✓';v.className='cr-value cr-blue';m.textContent='Ya pasas sin importar lo que saques. Relájate (un poco).';}
  else if(needed>5){v.textContent='>5.0';v.className='cr-value cr-red';m.textContent='No es matemáticamente posible. Habla con tu director de carrera.';}
  else{
    v.textContent=needed.toFixed(2);
    if(needed<=2.5){v.className='cr-value cr-green';m.textContent='Fácil. Lo tienes. No seas confiado igual.';}
    else if(needed<=3.5){v.className='cr-value cr-yellow';m.textContent='Alcanzable. Estudia bien estos días.';}
    else if(needed<=4.5){v.className='cr-value cr-red';m.textContent='Va a ser difícil, pero no imposible. Enfócate.';}
    else{v.className='cr-value cr-red';m.textContent='Necesitas casi perfecto. Activa el Modo Pánico. 🚨';}
  }
}

function calc2(){
  var w1=parseFloat(document.getElementById('c2_w1').value)/100;
  var n1=parseFloat(document.getElementById('c2_n1').value);
  var w2=parseFloat(document.getElementById('c2_w2').value)/100;
  if(isNaN(w1)||isNaN(n1)||isNaN(w2)||w2===0){calcResult(null,'cv2','cm2');return;}
  if(Math.round((w1+w2)*100)!==100){
    var v2=document.getElementById('cv2'),m2=document.getElementById('cm2');
    v2.textContent='⚠';v2.className='cr-value cr-yellow';
    m2.textContent='Los pesos deben sumar 100%. Suma actual: '+Math.round((w1+w2)*100)+'%.';
    return;
  }
  calcResult((3.0-w1*n1)/w2,'cv2','cm2');
}

function calc3(){
  var w1=parseFloat(document.getElementById('c3_w1').value)/100;
  var n1=parseFloat(document.getElementById('c3_n1').value);
  var w2=parseFloat(document.getElementById('c3_w2').value)/100;

  if(isNaN(w1)||isNaN(n1)||isNaN(w2)||isNaN(n2)||isNaN(w3)||w3===0){calcResult(null,'cv3','cm3');return;}
  if(Math.round((w1+w2+w3)*100)!==100){
    var v3=document.getElementById('cv3'),m3=document.getElementById('cm3');
    v3.textContent='⚠';v3.className='cr-value cr-yellow';
    m3.textContent='Los pesos deben sumar 100%. Suma actual: '+Math.round((w1+w2+w3)*100)+'%.';
    return;
  }

var MATERIAS_UNAL = [
  {nombre:'Cálculo Diferencial', creditos:4},
  {nombre:'Álgebra Lineal', creditos:3},
  {nombre:'Cálculo Integral', creditos:4},
  {nombre:'Cálculo Vectorial', creditos:4},

];

var promRows = [];
var promIdCounter = 0;

function addPromRow(nombre, creds, nota) {
  var id = ++promIdCounter;
  promRows.push({id:id, nombre:nombre||'', creditos:creds||3, nota:nota||''});
  renderPromRows();
}

function removePromRow(id) {
  promRows = promRows.filter(function(r){ return r.id !== id; });
  renderPromRows();
  calcProm();
}

function renderPromRows() {
  var container = document.getElementById('prom-rows');
  if(!container) return;
  
  var matSugg = MATERIAS_UNAL.map(function(m){
    return '<option value="'+m.nombre+'" data-cred="'+m.creditos+'">';
  }).join('');
  
  container.innerHTML = '<datalist id="mat-list-dl">'+matSugg+'</datalist>'
    + promRows.map(function(r) {
    return '<div class="prom-row" id="pr-'+r.id+'">'
      +'<input class="prom-inp" list="mat-list-dl" placeholder="Nombre de la materia" value="'+r.nombre.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')+'"'
        +' oninput="updateProw('+r.id+',\'nombre\',this.value);autoCredit('+r.id+',this.value)">'
      +'<input class="prom-inp" type="number" min="1" max="12" placeholder="Cr" value="'+r.creditos+'"'
        +' oninput="updateProw('+r.id+',\'creditos\',this.value)">'
      +'<input class="prom-inp" type="number" min="0" max="5" step="0.1" placeholder="0.0–5.0" value="'+(r.nota||'')+'"'
        +' oninput="updateProw('+r.id+',\'nota\',this.value)">'
      +'<button class="prom-del" onclick="removePromRow('+r.id+')" title="Eliminar" aria-label="Cerrar">✕</button>'
      +'</div>';
  }).join('');
}

function autoCredit(id, nombre) {
  var match = MATERIAS_UNAL.find(function(m){ return m.nombre.toLowerCase() === nombre.toLowerCase(); });
  if(match) {
    updateProw(id, 'creditos', match.creditos);
    var row = document.getElementById('pr-'+id);
    if(row) row.querySelectorAll('.prom-inp')[1].value = match.creditos;
    calcProm();
  }
}

function updateProw(id, field, val) {
  var row = promRows.find(function(r){ return r.id === id; });
  if(row) row[field] = field === 'creditos' ? +val : (field === 'nota' ? val : val);
  calcProm();
}

function calcProm() {
  var totalCred = 0, sumProd = 0, aprobadas = 0, reprobadas = 0, sinNota = 0;
  promRows.forEach(function(r) {
    var cred = parseFloat(r.creditos) || 0;
    var nota = parseFloat(r.nota);
    if(isNaN(nota) || r.nota === '') { sinNota++; return; }
    totalCred += cred;
    sumProd += cred * nota;
    if(nota >= 3.0) aprobadas++; else reprobadas++;
  });
  
  var notaEl = document.getElementById('prom-nota');
  var statEl = document.getElementById('prom-status');
  var statsEl = document.getElementById('prom-stats');
  var hintEl = document.getElementById('prom-hint');
  var barEl = document.getElementById('prom-bar-fill');
  if(!notaEl) return;

  if(totalCred === 0 || promRows.length === 0) {
    notaEl.textContent = '—';
    notaEl.style.color = 'var(--t2)';
    statEl.innerHTML = '';
    statsEl.innerHTML = '';
    if(barEl) barEl.style.width = '0%';
    hintEl.textContent = 'Agrega tus materias para calcular.';
    return;
  }
  
  var prom = sumProd / totalCred;
  notaEl.textContent = prom.toFixed(2);
  notaEl.style.color = prom >= 3.8 ? 'var(--grn)' : prom >= 3.0 ? 'var(--yel)' : 'var(--red)';
  
  var statusTxt = prom >= 4.5 ? 'Excelente · Honor roll' : prom >= 3.8 ? 'Muy bien · Sobresaliente' : prom >= 3.0 ? 'Aprobado' : 'Riesgo académico';
  var statusCls = prom >= 3.0 ? (prom >= 3.8 ? 'ps-green' : 'ps-yellow') : 'ps-red';
  statEl.innerHTML = '<span class="prom-status '+statusCls+'">'+statusTxt+'</span>';
  
  if(barEl) {
    barEl.style.width = (prom/5*100)+'%';
    barEl.style.background = prom >= 3.8 ? 'var(--grn)' : prom >= 3.0 ? 'var(--yel)' : 'var(--red)';
  }
  
  statsEl.innerHTML = 
    '<div class="ps-row"><span>Total créditos</span><strong>'+totalCred+'</strong></div>'
    +'<div class="ps-row"><span>Materias aprobadas</span><strong style="color:var(--grn)">'+aprobadas+'</strong></div>'
    +(reprobadas?'<div class="ps-row"><span>Materias reprobadas</span><strong style="color:var(--red)">'+reprobadas+'</strong></div>':'')
    +(sinNota?'<div class="ps-row"><span>Sin nota aún</span><strong style="color:var(--t3)">'+sinNota+'</strong></div>':'')
    +'<div class="ps-row"><span>Créditos × nota prom.</span><strong>'+sumProd.toFixed(1)+'</strong></div>';
  
  var pendCred = promRows.filter(function(r){return r.nota===''||isNaN(parseFloat(r.nota));}).reduce(function(s,r){return s+(parseFloat(r.creditos)||0);},0);
  var totalAllCred = totalCred + pendCred;
  if(prom < 3.0 && sinNota > 0 && pendCred > 0) {
    var needed = Math.min(5, (3.0 * totalAllCred - sumProd) / pendCred);
    hintEl.innerHTML = 'Para llegar a 3.0 necesitas <em>'+needed.toFixed(2)+'</em> prom. en las materias pendientes ('+(pendCred)+' créd.).';
  } else if(prom >= 3.0) {
    hintEl.innerHTML = 'Vas bien ✓ Para <em>4.0+</em> mantén ese promedio cada semestre.';
  } else {
    hintEl.textContent = 'Completa todas las notas para ver el análisis.';
  }
}

var params = (window.__pageParams||new URLSearchParams(window.location.search));
var examKey = params.get('exam') || 'calcdif_p1';

/* ── Persistencia (localStorage) ── */
var MU_RESULTS='mu-results', MU_PROG='mu-prog-'+examKey;

function resumeExam(){
  var prog=null; try{prog=JSON.parse(localStorage.getItem(MU_PROG));}catch(e){}
  if(!prog||!prog.answers){ startExam(); return; }
  answers=prog.answers; selfGrades=prog.selfGrades||new Array(exam.preguntas.length).fill(null);
  openAnswers=prog.openAnswers||new Array(exam.preguntas.length).fill('');
  checked=prog.checked||new Array(exam.preguntas.length).fill(false);
