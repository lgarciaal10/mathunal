var currentQ = 0;
var answers = [];
var checked = [];
var timerSecs = exam.tiempo * 60;
var timerInterval = null;
var paused = false;
var selfGrades = [];
var openAnswers = [];
var startTime = null;
var endTime = null;
var renderReady = (typeof window.renderMathInElement !== 'undefined');
window.__muRerender = function(){ renderReady = true; try{ tryRender(); }catch(e){} };
var pendingRender = false;

function tryRender(){
  if(renderReady){
    document.querySelectorAll('.katex-pending').forEach(function(el){
      el.classList.remove('katex-pending');
      renderMathInElement(el, {delimiters:[
        {left:'$$',right:'$$',display:true},
        {left:'$',right:'$',display:false}
      ],throwOnError:false});
    });
  }
}

function renderEl(el){
  if(renderReady){
    renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],throwOnError:false});
  } else {
    el.classList.add('katex-pending');
  }
}

/* ── TIMER ── */
function startTimer(){
  document.getElementById('timer-bar').style.display='flex';
  updateTimerDisplay();
  timerInterval = setInterval(function(){
    if(!paused){
      timerSecs--;
      updateTimerDisplay();
      if(timerSecs<=0){clearInterval(timerInterval);finishExam();}
    }
  },1000);
}

function updateTimerDisplay(){
  var m=Math.floor(timerSecs/60), s=timerSecs%60;
  var disp=document.getElementById('timer-disp');
  disp.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  disp.className='timer-display'+(timerSecs<=300?' danger':timerSecs<=600?' warn':'');
}

function togglePause(){
  paused=!paused;
  document.getElementById('pause-btn').textContent=paused?'▶ Continuar':'⏸ Pausar';
}

function timeUsed(){
  if(!startTime)return'—';
  var used=Math.round((Date.now()-startTime)/1000);
  var um=Math.floor(used/60),us=used%60;
  return (um<10?'0':'')+um+':'+(us<10?'0':'')+us;
}

/* ── EXAM FLOW ── */
function startExam(){
  answers=new Array(exam.preguntas.length).fill(-1);
  selfGrades=new Array(exam.preguntas.length).fill(null);
  openAnswers=new Array(exam.preguntas.length).fill('');
  checked=new Array(exam.preguntas.length).fill(false);
  currentQ=0;
  timerSecs=exam.tiempo*60;
  startTime=Date.now();
  showScreen('screen-q');
  startTimer();
  renderQ(0);
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.getElementById(id).classList.add('active');
}

function renderQ(idx){
  var q=exam.preguntas[idx];
  var n=exam.preguntas.length;
  document.getElementById('q-counter').textContent='Pregunta '+(idx+1)+' de '+n;
  document.getElementById('q-progress-txt').textContent=(checked.filter(Boolean).length)+' / '+n;
  document.getElementById('prog-fill').style.width=(checked.filter(Boolean).length/n*100)+'%';

  var statusBadge=document.getElementById('q-status-badge');
  var tipoBadge=q.tipo==='abierta'
    ?'<span class="q-tipo-badge badge-open">✏️ Desarrollo</span>'
    :'<span class="q-tipo-badge badge-mcq">◉ Seleccion multiple</span>';

  if(checked[idx]){
    var correct=q.tipo==='abierta'?selfGrades[idx]===true:(answers[idx]===q.correcta);
    statusBadge.innerHTML='<span style="font-family:\'JetBrains Mono\',monospace;font-size:.68rem;padding:.2rem .55rem;border-radius:4px;font-weight:700;'
      +(correct?'color:var(--grn);background:rgba(34,197,94,.12)':'color:var(--red);background:rgba(248,113,113,.1)')+'">'
      +(correct?'✓ Correcta':'✗ Incorrecta')+'</span>';
  } else {
    statusBadge.innerHTML='';
  }

  var qText=document.getElementById('q-text');
  qText.innerHTML=tipoBadge+q.texto;
  renderEl(qText);

  var optsEl=document.getElementById('q-options');
  var checkBtn=document.getElementById('btn-check');
  var explCard=document.getElementById('expl-card');
  explCard.classList.remove('show');

  if(q.tipo==='abierta'){
    optsEl.innerHTML=
      '<div class="q-open-area">'
        +'<span class="q-open-label">✏️ Tu desarrollo — trabaja en papel, luego escribe tu resultado aqui</span>'
        +'<textarea class="q-textarea" id="q-answer-txt" placeholder="Escribe tu respuesta o el resultado final..." '
        +(checked[idx]?'disabled':'')+'>'+((openAnswers[idx])||'')+'</textarea>'
      +'</div>'
      +'<div class="sol-card'+(checked[idx]?' show':'') +'" id="sol-card">'
        +'<div class="sol-card-hd">✓ Solucion completa paso a paso</div>'
        +'<div class="expl-steps" id="sol-steps">'
          +q.solucion.map(function(paso,i){
            return '<div class="expl-step"><div class="step-n">'+(i+1)+'</div><div class="step-txt">'+paso+'</div></div>';
          }).join('')
        +'</div>'
      +'</div>'
      +'<div class="self-eval'+(checked[idx]?'':' show')+'" id="self-eval" style="display:'+(checked[idx]?'none':'')+';">'
        +'<div class="self-eval-lbl">Despues de ver la solucion: ¿resolviste este ejercicio correctamente?</div>'
        +'<div class="self-btns">'
          +'<button class="sbtn-yes" onclick="selfEval(true)">✓ Si, lo resolvi bien</button>'
          +'<button class="sbtn-no" onclick="selfEval(false)">✗ No, cometí errores</button>'
        +'</div>'
      +'</div>';

    if(checked[idx]){
      optsEl.querySelectorAll('.step-txt').forEach(renderEl);
    }

    if(!checked[idx]){
      checkBtn.style.display='flex';
      checkBtn.textContent='Ver solucion completa';
      checkBtn.disabled=false;
    } else {
      checkBtn.style.display='none';
    }

    document.getElementById('btn-prev').disabled=(idx===0);
    document.getElementById('btn-next').textContent=idx===n-1?'Ver resultados →':'Siguiente →';
    return;
  }

  // MCQ
  var letters=['A','B','C','D'];
  optsEl.innerHTML=q.opciones.map(function(opt,i){
    var cls='q-opt';
    if(checked[idx]){
      if(i===q.correcta)cls+=' correct';
      else if(i===answers[idx])cls+=' wrong';
    } else {
      if(i===answers[idx])cls+=' selected';
    }
    return '<div class="'+cls+'" onclick="selectOpt('+i+')" id="opt-'+i+'">'
      +'<div class="q-opt-letter">'+letters[i]+'</div>'
      +'<div class="q-opt-text">'+opt+'</div>'
      +'</div>';
  }).join('');
  optsEl.querySelectorAll('.q-opt-text').forEach(renderEl);

  if(checked[idx]){
    checkBtn.style.display='none';
    explCard.classList.add('show');
    renderExplanation(idx);
  } else {
    checkBtn.style.display='flex';
    checkBtn.textContent='Confirmar respuesta';
    checkBtn.disabled=false;
  }

  document.getElementById('btn-prev').disabled=(idx===0);
  document.getElementById('btn-next').textContent=idx===n-1?'Ver resultados →':'Siguiente →';
}

function selectOpt(i){
  if(checked[currentQ])return;
  answers[currentQ]=i;
  document.querySelectorAll('.q-opt').forEach(function(el){el.classList.remove('selected');});
  document.getElementById('opt-'+i).classList.add('selected');
}

function checkAnswer(){
  muSaveProgress();
  var q=exam.preguntas[currentQ];
  if(q.tipo==='abierta'){
    var txt=document.getElementById('q-answer-txt');
    if(txt)openAnswers[currentQ]=txt.value;
    var sol=document.getElementById('sol-card');
    var se=document.getElementById('self-eval');
    if(sol)sol.classList.add('show');
    if(se){se.style.display='block';se.classList.add('show');}
    sol.querySelectorAll('.step-txt').forEach(renderEl);
    document.getElementById('btn-check').style.display='none';
    if(txt)txt.disabled=true;
    return;
  }
  if(answers[currentQ]===-1){
    document.getElementById('btn-check').textContent='Selecciona una opcion primero';
    setTimeout(function(){document.getElementById('btn-check').textContent='Confirmar respuesta';},1500);
    return;
  }
  checked[currentQ]=true;
  renderQ(currentQ);
}

function selfEval(correct){
  selfGrades[currentQ]=correct;
  checked[currentQ]=true;
  var se=document.getElementById('self-eval');
  if(se)se.style.display='none';
  var n=exam.preguntas.length;
  document.getElementById('q-progress-txt').textContent=(checked.filter(Boolean).length)+' / '+n;
  document.getElementById('prog-fill').style.width=(checked.filter(Boolean).length/n*100)+'%';
  var statusBadge=document.getElementById('q-status-badge');
  statusBadge.innerHTML='<span style="font-family:\'JetBrains Mono\',monospace;font-size:.68rem;padding:.2rem .55rem;border-radius:4px;font-weight:700;'
    +(correct?'color:var(--grn);background:rgba(34,197,94,.12)':'color:var(--red);background:rgba(248,113,113,.1)')+'">'
    +(correct?'✓ Correcta':'✗ Incorrecta')+'</span>';
}

function renderExplanation(idx){
  var q=exam.preguntas[idx];
  var correct=answers[idx]===q.correcta;
  var letters=['A','B','C','D'];
  var resultEl=document.getElementById('expl-result');
  resultEl.className='expl-result '+(correct?'correct-r':'wrong-r');
  resultEl.innerHTML=(correct?'✓ ¡Correcto! Bien hecho.':'✗ Incorrecto — la respuesta correcta es '+letters[q.correcta]);

  var sumEl=document.getElementById('expl-summary');
  sumEl.innerHTML=q.resumen;
  renderEl(sumEl);

  var stepsEl=document.getElementById('expl-steps');
  stepsEl.innerHTML=q.pasos.map(function(paso,i){
    return '<div class="expl-step">'
      +'<div class="step-n">'+(i+1)+'</div>'
      +'<div class="step-txt">'+paso+'</div>'
      +'</div>';
  }).join('');
  stepsEl.querySelectorAll('.step-txt').forEach(renderEl);
}

function goQ(dir){
  var next=currentQ+dir;
  if(next<0)return;
  if(next>=exam.preguntas.length){finishExam();return;}
  currentQ=next;
  renderQ(currentQ);
}

function finishExam(){
  clearInterval(timerInterval);
  endTime=Date.now();
  var correct=0;
  exam.preguntas.forEach(function(q,i){if(q.tipo==="abierta"){if(selfGrades[i]===true)correct++;}else{if(answers[i]===q.correcta)correct++;}});
  var total=exam.preguntas.length;
  var pct=Math.round(correct/total*100);
  var nota=(correct/total*5).toFixed(1);

  document.getElementById('score-pct').textContent=nota;
  document.getElementById('r-correct').textContent=correct;
  document.getElementById('r-wrong').textContent=total-correct;
  document.getElementById('r-time').textContent=timeUsed();

  var titles=['Sigue practicando','Casi lo logras','¡Aprobado!','¡Muy bien!','¡Excelente!'];
  var titleIdx=pct<40?0:pct<60?1:pct<75?2:pct<90?3:4;
  document.getElementById('result-title').textContent=titles[titleIdx];
  document.getElementById('result-sub').textContent=
    correct+' de '+total+' correctas · Nota estimada: '+nota+' / 5.0';

  var circ=2*Math.PI*60;
  var fill=document.getElementById('ring-fill');
  fill.style.stroke=pct>=60?'var(--grn)':pct>=40?'var(--yel)':'var(--red)';
  fill.style.strokeDashoffset=circ*(1-pct/100);

  var letters=['A','B','C','D'];
  var reviewEl=document.getElementById('review-list');
  reviewEl.innerHTML=exam.preguntas.map(function(q,i){
    var ok=answers[i]===q.correcta;
    var userAns=answers[i]>=0?letters[answers[i]]:'—';
    return '<div class="review-item '+(ok?'ri-correct':'ri-wrong')+'">'
      +'<div class="ri-top">'
        +'<div class="ri-num">'+(i+1)+'</div>'
        +'<div class="ri-q">Pregunta '+(i+1)+'</div>'
      +'</div>'
      +'<div class="ri-ans">'
        +(ok
          ?'<em>✓ Correcto — '+letters[q.correcta]+'</em>'
          :'<span>✗ Tu respuesta: '+userAns+'</span> · Correcta: <em>'+letters[q.correcta]+'</em>'
        )
      +'</div>'
      +'</div>';
  }).join('');


  /* populate share card */
  var scNota = document.getElementById('sc-nota');
  var scC = document.getElementById('sc-c');
  var scT = document.getElementById('sc-t');
  var scTm = document.getElementById('sc-tm');
  var scLabel = document.getElementById('sc-label');
  if(scNota){ scNota.textContent = nota; scNota.style.color = pct>=60?'var(--grn)':pct>=40?'var(--yel)':'var(--red)'; }
  if(scC) scC.textContent = correct;
  if(scT) scT.textContent = total;
  if(scTm) scTm.textContent = timeUsed();
  if(scLabel) scLabel.textContent = '/ 5.0 · ' + (pct>=60?'Aprobado':'Necesitas más práctica');

  /* share functions */
  muSaveResult({exam:examKey,nota:parseFloat(nota),correct:correct,total:total,pct:pct,date:new Date().toISOString()});
  muClearProgress();
  document.getElementById('timer-bar').style.display='none';
  showScreen('screen-results');
  setTimeout(function(){
    document.getElementById('ring-fill').style.transition='stroke-dashoffset 1.5s ease';
  },100);
}


function shareWA(){

  var tm = document.getElementById('sc-tm').textContent;
  var txt = '📊 MathUNAL · Simulacro Cálculo Diferencial\nNota: ' + nota + '/5.0 | ' + correct + '/' + total + ' correctas | ' + tm + '\nmathunal.github.io';

function shareIG(){

function restartExam(){

}

/* Init intro */
document.getElementById('intro-title').textContent=exam.titulo;
document.getElementById('intro-sem').textContent=exam.semestre;
document.getElementById('intro-desc').textContent=exam.desc;
document.getElementById('intro-nq').textContent=exam.preguntas.length;

muIntroHistory();
</script>

function toggleSettings(){document.getElementById('settings-dd').classList.toggle('open');}
document.addEventListener('click',function(e){var w=document.querySelector('.settings-wrap');if(w&&!w.contains(e.target)){var d=document.getElementById('settings-dd');if(d)d.classList.remove('open');}});
(function(){var s=localStorage.getItem('mu-theme');if(s)setTheme(s);})();

var FORMULAS = [
  // LIMITES
  {tag:'lim',tagLabel:'Límites',name:'Identidad fundamental seno',formula:'\\\\lim_{x \\\\to 0} \\\\dfrac{\\\\sin x}{x} = 1',desc:'La forma fundamental de evaluar límites trigonométricos. Aplica cuando tienes sen(u)/u con u→0.',tip:'Tip: multiplica y divide para llevar a esta forma.'},
  {tag:'lim',tagLabel:'Límites',name:'Regla de L\'Hôpital',formula:'\\\\lim_{x\\\\to a}\\\\dfrac{f(x)}{g(x)} = \\\\lim_{x\\\\to a}\\\\dfrac{f\'(x)}{g\'(x)}',desc:'Para formas 0/0 o ∞/∞. Deriva numerador y denominador por separado (no es regla del cociente).',tip:'Solo aplica cuando tienes 0/0 o ∞/∞.'},
  {tag:'lim',tagLabel:'Límites',name:'Límite en el infinito — cociente',formula:'\\\\lim_{x\\\\to\\\\infty}\\\\dfrac{ax^n+\\\\cdots}{bx^n+\\\\cdots} = \\\\dfrac{a}{b}',desc:'Si el grado del numerador y denominador es igual, el límite es el cociente de los coeficientes líderes.',tip:'Si num > den → ∞. Si num < den → 0.'},
  {tag:'lim',tagLabel:'Límites',name:'Número e como límite',formula:'\\\\lim_{n\\\\to\\\\infty}\\\\left(1+\\\\dfrac{1}{n}\\\\right)^n = e',desc:'Definición del número de Euler. Generalización: lim(1+k/n)^n = e^k.',tip:'Aparece en crédito continuo y en derivadas de ln(x).'},
  // DERIVADAS
  {tag:'der',tagLabel:'Derivadas',name:'Regla de la potencia',formula:'\\\\dfrac{d}{dx}[x^n] = nx^{n-1}',desc:'La regla más usada. Funciona para cualquier exponente real n.',tip:'Recuerda bajar el exponente y restar 1.'},
  {tag:'der',tagLabel:'Derivadas',name:'Regla del producto',formula:'(uv)\' = u\'v + uv\'',desc:'Para derivar un producto de dos funciones. Nunca es u\'v\'.',tip:'Memoriza con: "la primera por la derivada de la segunda, más la segunda por la derivada de la primera".'},
  {tag:'der',tagLabel:'Derivadas',name:'Regla del cociente',formula:'\\\\left(\\\\dfrac{u}{v}\\\\right)\' = \\\\dfrac{u\'v - uv\'}{v^2}',desc:'Para el cociente de dos funciones. El denominador va al cuadrado.',tip:'Mnemónico: "lo de abajo por la derivada de lo de arriba, menos lo de arriba por la derivada de lo de abajo, todo sobre lo de abajo al cuadrado."'},
  {tag:'der',tagLabel:'Derivadas',name:'Regla de la cadena',formula:'\\\\dfrac{d}{dx}[f(g(x))] = f\'(g(x))\\\\cdot g\'(x)',desc:'Para la composición de funciones. Deriva "la de afuera dejando lo de adentro intacto", luego multiplica por la derivada de adentro.',tip:'Clave: identifica la función exterior y la interior.'},
  {tag:'der',tagLabel:'Derivadas',name:'Derivada de sen y cos',formula:'\\\\dfrac{d}{dx}[\\\\sin x]=\\\\cos x \\\\quad \\\\dfrac{d}{dx}[\\\\cos x]=-\\\\sin x',desc:'Las derivadas trigonométricas básicas. El signo negativo solo aparece al derivar coseno.',tip:'Ciclo: sen→cos→-sen→-cos→sen.'},
  {tag:'der',tagLabel:'Derivadas',name:'Derivada de e^x y ln(x)',formula:'\\\\dfrac{d}{dx}[e^x]=e^x \\\\qquad \\\\dfrac{d}{dx}[\\\\ln x]=\\\\dfrac{1}{x}',desc:'La exponencial es su propia derivada. Para a^x: la derivada es a^x·ln(a).',tip:'El logaritmo natural transforma productos en sumas, útil para derivadas logarítmicas.'},
  {tag:'der',tagLabel:'Derivadas',name:'Derivada implícita',formula:'\\\\dfrac{d}{dx}[y^n] = ny^{n-1}\\\\cdot\\\\dfrac{dy}{dx}',desc:'Al derivar y en función de x, siempre multiplica por dy/dx. Despeja dy/dx al final.',tip:'Aplica para curvas donde y no está despejada, como x²+y²=r².'},
  // INTEGRALES
  {tag:'int',tagLabel:'Integrales',name:'Regla de la potencia',formula:'\\\\int x^n\\,dx = \\\\dfrac{x^{n+1}}{n+1} + C, \\\\quad n\\\\neq -1',desc:'La antiderivada fundamental. Sube el exponente en 1 y divide por el nuevo exponente.',tip:'Para n=-1: ∫(1/x)dx = ln|x| + C.'},
  {tag:'int',tagLabel:'Integrales',name:'Sustitución (u-sub)',formula:'\\\\int f(g(x))g\'(x)\\,dx = \\\\int f(u)\\,du',desc:'Cuando ves una función y su derivada en la integral. Haz u=g(x), du=g\'(x)dx.',tip:'Busca el "relleno" de la integral compuesta y llámalo u.'},
  {tag:'int',tagLabel:'Integrales',name:'Integración por partes',formula:'\\\\int u\\,dv = uv - \\\\int v\\,du',desc:'Para productos de funciones diferentes. Elige u y dv según ILATE: Inversa, Log, Algebraica, Trigonométrica, Exponencial.',tip:'ILATE: lo que va primero como u.'},
  {tag:'int',tagLabel:'Integrales',name:'Integrales trigonométricas',formula:'\\\\int \\\\sin x\\,dx = -\\\\cos x+C \\\\quad \\\\int \\\\cos x\\,dx = \\\\sin x+C',desc:'Antiderivadas básicas trig. Para ∫tan x dx = ln|sec x| + C.',tip:'El signo de -cos viene de que la derivada de cos es -sen.'},
  {tag:'int',tagLabel:'Integrales',name:'Teorema fundamental',formula:'\\\\int_a^b f(x)\\,dx = F(b) - F(a)',desc:'Conecta integración y derivación. F(x) es la antiderivada de f(x). Es la fórmula más importante del cálculo.',tip:'Evalúa F en los límites y resta. No olvides el signo.'},
  // ALGEBRA LINEAL
  {tag:'alg',tagLabel:'Álgebra Lineal',name:'Determinante 2×2',formula:'\\\\det\\\\begin{pmatrix}a&b\\\\\\\\c&d\\\\end{pmatrix} = ad - bc',desc:'La cruz: multiplicación diagonal principal menos diagonal secundaria.',tip:'Para 3×3 usa cofactores (expansión por filas/columnas).'},
  {tag:'alg',tagLabel:'Álgebra Lineal',name:'Inversa de matriz 2×2',formula:'A^{-1} = \\\\dfrac{1}{\\\\det(A)}\\\\begin{pmatrix}d&-b\\\\\\\\-c&a\\\\end{pmatrix}',desc:'Intercambia los elementos de la diagonal principal y cambia el signo de los otros. Solo existe si det(A)≠0.',tip:'Verifica: A·A⁻¹ = I.'},
  {tag:'alg',tagLabel:'Álgebra Lineal',name:'Valores propios',formula:'\\\\det(A - \\\\lambda I) = 0',desc:'El polinomio característico. Los valores de λ que satisfacen esta ecuación son los eigenvalores de A.',tip:'Los vectores propios se hallan resolviendo (A-λI)x=0 para cada λ.'},
  {tag:'alg',tagLabel:'Álgebra Lineal',name:'Transformación lineal',formula:'T(\\\\alpha u + \\\\beta v) = \\\\alpha T(u) + \\\\beta T(v)',desc:'Una transformación es lineal si respeta la adición y el escalamiento. Esto es linealidad.',tip:'Cualquier matriz define una transformación lineal T(x)=Ax.'},
  // TRIGONOMETRIA
  {tag:'tri',tagLabel:'Trigonometría',name:'Identidad de Pitágoras',formula:'\\\\sin^2\\\\theta + \\\\cos^2\\\\theta = 1',desc:'La identidad trigonométrica fundamental. Se deriva del teorema de Pitágoras.',tip:'Otras formas: 1+tan²θ=sec²θ y 1+cot²θ=csc²θ.'},
  {tag:'tri',tagLabel:'Trigonometría',name:'Fórmulas de adición',formula:'\\\\sin(a\\\\pm b)=\\\\sin a\\\\cos b\\\\pm\\\\cos a\\\\sin b',desc:'Para seno de una suma o diferencia de ángulos.',tip:'Para coseno: cos(a±b)=cos a cos b ∓ sin a sin b.'},
  {tag:'tri',tagLabel:'Trigonometría',name:'Ángulo doble',formula:'\\\\sin 2\\\\theta = 2\\\\sin\\\\theta\\\\cos\\\\theta \\\\quad \\\\cos 2\\\\theta = \\\\cos^2\\\\theta - \\\\sin^2\\\\theta',desc:'Identidades de ángulo doble, útiles para simplificar integrales.',tip:'Para cos 2θ también: 1-2sin²θ o 2cos²θ-1.'},
  // SERIES
  {tag:'ser',tagLabel:'Series',name:'Serie de Taylor',formula:'f(x) = \\\\sum_{n=0}^{\\\\infty}\\\\dfrac{f^{(n)}(a)}{n!}(x-a)^n',desc:'Representa una función como una serie de potencias centrada en a. Si a=0, es la serie de Maclaurin.',tip:'Las series más importantes: e^x, sin(x), cos(x), 1/(1-x).'},
  {tag:'ser',tagLabel:'Series',name:'Criterio de la razón',formula:'\\\\lim_{n\\\\to\\\\infty}\\\\left|\\\\dfrac{a_{n+1}}{a_n}\\\\right| = L',desc:'Si L<1 → converge. Si L>1 → diverge. Si L=1 → inconcluso.',tip:'Ideal para series con factoriales o potencias.'},
  {tag:'ser',tagLabel:'Series',name:'Serie geométrica',formula:'\\\\sum_{n=0}^{\\\\infty}ar^n = \\\\dfrac{a}{1-r}, \\\\quad |r|<1',desc:'Converge solo si |r|<1. La suma es a/(1-r) donde a es el primer término y r la razón.',tip:'Aplica cuando cada término es r veces el anterior.'},
  // EDO
  {tag:'edo',tagLabel:'EDO',name:'EDO lineal de 1er orden',formula:'y\' + P(x)y = Q(x) \\\\quad \\\\mu = e^{\\\\int P\\,dx}',desc:'Factor integrante μ = e^(∫P dx). Multiplica toda la ecuación por μ para que el lado izquierdo sea (μy)\'.',tip:'Después de multiplicar por μ: integra ambos lados.'},
  {tag:'edo',tagLabel:'EDO',name:'EDO separable',formula:'\\\\dfrac{dy}{dx} = f(x)g(y) \\\\Rightarrow \\\\int\\\\dfrac{dy}{g(y)} = \\\\int f(x)\\,dx',desc:'Separa x e y en lados distintos del igual y luego integra.',tip:'Busca que la ecuación sea un producto de una función de x por una de y.'},
  {tag:'edo',tagLabel:'EDO',name:'Transformada de Laplace',formula:'\\\\mathcal{L}\\\\{f(t)\\\\} = \\\\int_0^{\\\\infty} e^{-st}f(t)\\,dt',desc:'Transforma una EDO en una ecuación algebraica. Las más usadas: L{1}=1/s, L{t^n}=n!/s^(n+1), L{e^at}=1/(s-a).',tip:'Aplica condiciones iniciales directamente en el dominio s.'},
];

var currentFilter = 'all';
var currentSearch = '';

function renderGrid(){
  var data = FORMULAS.filter(function(f){
    var matchFilter = currentFilter === 'all' || f.tag === currentFilter;
    var matchSearch = !currentSearch || 
      f.name.toLowerCase().includes(currentSearch) ||
      f.desc.toLowerCase().includes(currentSearch) ||
      f.tagLabel.toLowerCase().includes(currentSearch);
    return matchFilter && matchSearch;
  });
  
  var tagClasses = {lim:'tag-lim',der:'tag-der',int:'tag-int',alg:'tag-alg',tri:'tag-tri',ser:'tag-ser',edo:'tag-edo'};
  var grid = document.getElementById('grid');
  
  if(!data.length){
    grid.innerHTML = '<p style="color:var(--t2);padding:2rem;grid-column:1/-1">No hay fórmulas para este filtro. 🔍</p>';
    return;
  }
  
  grid.innerHTML = data.map(function(f){
    return '<div class="fcard">'
      +'<div class="fcard-top">'
        +'<div class="fcard-name">'+f.name+'</div>'
        +'<span class="fcard-tag '+tagClasses[f.tag]+'">'+f.tagLabel+'</span>'
      +'</div>'
      +'<div class="fcard-formula" data-formula="'+encodeURIComponent(f.formula)+'">$$'+f.formula+'$$</div>'
      +'<div class="fcard-desc">'+f.desc+'</div>'
      +'<div class="fcard-tip">💡 '+f.tip+'</div>'
      +'</div>';
  }).join('');
  
  renderMath();
}

function renderMath(){
  if(typeof katex === 'undefined') return;
  document.querySelectorAll('.fcard-formula').forEach(function(el){
    var raw = decodeURIComponent(el.getAttribute('data-formula'));
    // Las fórmulas vienen con escape 8x (\\\\ → \). Normalizar a 1 backslash (saltos \\ → 2).
    raw = raw.replace(/\\\\/g,'\\').replace(/\\\\/g,'\\').replace(/\\\\/g,'\\');
    el.innerHTML = '';
    katex.render(raw, el, {displayMode:true, throwOnError:false});
  });
}

function initRender(){
  renderGrid();
}

function setFilter(btn, tag){
  document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  currentFilter = tag;
  renderGrid();
}

function doSearch(val){
  currentSearch = val.toLowerCase().trim();
  renderGrid();
}

window.__muRerender = function(){ try{ renderMath(); }catch(e){} };
renderGrid();
</script>
</template>

<script>

/* ── MathUNAL SPA Router ── */
var KNOWN = ['home','simulacro','materia','formulas'];

function muNav(href) {
  if (!href) return;
  if (href.startsWith('http')||href.startsWith('mailto')||href.startsWith('tel')) {
    window.open(href,'_blank'); return;
  }
  if (href.startsWith('#')) {
    var page = href.slice(1).split('?')[0];
    if (KNOWN.includes(page)) {
      history.pushState(null,'',href); // keep URL pretty
      _loadPage(href);
    } else {
      // in-page anchor
      var el = document.getElementById(page);
      if (el) el.scrollIntoView({behavior:'smooth'});
    }
  }
}

function _loadPage(hash) {
  if (!hash || hash==='#') hash='#home';
  var raw   = hash.startsWith('#') ? hash.slice(1) : hash;
  var parts = raw.split('?');
  var page  = parts[0] || 'home';
  var qs    = parts[1] || '';

  if (!KNOWN.includes(page)) {
    // treat as in-page anchor
    var el = document.getElementById(page);
    if (el) { el.scrollIntoView({behavior:'smooth'}); return; }
    page = 'home'; qs = '';
  }

  var tpl = document.getElementById('tpl-'+page);
  var app = document.getElementById('mu-app');
  if (!tpl || !app) return;

  // Set params BEFORE scripts run
  window.__pageParams = new URLSearchParams(qs);
  window.__muRerender = null;  // reset; the page's own script re-defines it if needed

  // Inject template
  app.innerHTML = '';
  app.appendChild(document.importNode(tpl.content, true));

  // Re-execute scripts (templates don't auto-run them)
  Array.from(app.querySelectorAll('script')).forEach(function(s){
    var n = document.createElement('script');
    if (s.src) { n.src = s.src; n.async = false; }
    else { n.textContent = s.textContent; }
    s.parentNode.replaceChild(n, s);
  });

  window.scrollTo(0, 0);

  // If KaTeX is already available, make sure this page's math is rendered.
  if (typeof window.renderMathInElement !== 'undefined' && window.__muRerender) {
    try { window.__muRerender(); } catch(e){}
  }

  // Post-load hook: refresh the progress panel on home
  if (page === 'home' && typeof window.muRenderProgreso === 'function') {
    try { window.muRenderProgreso(); } catch(e){}
  }
}

window.addEventListener('popstate', function(){ _loadPage(location.hash); });

// Intercept all clicks on hash links
document.addEventListener('click', function(e){
  var a = e.target.closest('a');
  if (!a) return;
  var href = a.getAttribute('href');
  if (!href || href==='#' || href.startsWith('http')||href.startsWith('mailto')||href.startsWith('tel')) return;
  if (href.startsWith('#')) {
    e.preventDefault();
    muNav(href);
  }
});

// When KaTeX finishes loading, re-render math on the current page (handles direct loads)
window.__onKatexReady = function(){
  if (window.__muRerender) { try { window.__muRerender(); } catch(e){} }
};

// Boot after DOM is ready so deferred KaTeX has loaded before the first render
function _boot(){
  // Aplica estado Premium temprano (no depende del script de ninguna página)
  try { if (localStorage.getItem('mu-premium')==='1') document.documentElement.classList.add('is-premium'); } catch(e){}
  _loadPage(location.hash || '#home');
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', _boot);
} else {
  _boot();
}


/* PWA: registrar service worker */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(e){ console.warn('SW no registrado:', e); });
  });
}

</script>
