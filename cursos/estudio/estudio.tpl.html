<script>
var D=/*DATA*/;
(function(){

/* estado de cada lección, mezclando lo que dejan las lecciones y esta página */
function estado(id){

var NOM={new:'sin datos',vis:'visto',rev:'por revisar',dom:'dominado'};
/* una pregunta, con confianza, retroalimentación y registro en el cuaderno */
function preguntar(q,cont,fin,opc){

   +'<div class="conf" role="group" aria-label="Qué tan seguro estás"><span>¿Qué tan seguro estás?</span><button class="chip" type="button" data-c="2" aria-pressed="false">Seguro</button><button class="chip" type="button" data-c="1" aria-pressed="false">Más o menos</button><button class="chip" type="button" data-c="0" aria-pressed="false">Adivino</button></div>';

  h+='<p class="fb" aria-live="polite"></p><div class="row" data-sig></div>';
  cont.innerHTML=h; mates(cont);
  [].forEach.call(cont.querySelectorAll('.conf button'),function(b){ b.addEventListener('click',function(){ if(hecho) return; conf=+b.getAttribute('data-c'); [].forEach.call(cont.querySelectorAll('.conf button'),function(o){ o.setAttribute('aria-pressed',o===b?'true':'false'); }); }); });
  var fb=cont.querySelector('.fb');

    if(ok){ if(er[id]){ er[id].ok=true; er[id].tsok=Date.now(); guarda(K.err,er); } }
    else { var e=er[id]||{lid:q.lid,lt:l.titulo,curso:l.curso,q:q.hq,opts:q.t==='mcq'?q.o:null,correcta:q.t==='mcq'?q.c:null,respuesta:q.t==='num'?q.r:null,expl:q.e||'',fallos:[],n:0,ok:false};
      e.n++; e.ok=false; e.ts=Date.now(); e.fallos.push({i:elegida==null?null:elegida,resp:resp==null?null:resp,err:err||'',conf:conf}); if(e.fallos.length>6) e.fallos=e.fallos.slice(-6); er[id]=e; guarda(K.err,er); }

}
var V=document.getElementById('vista');
function tarjetaSerie(titulo,cuerpo){ return '<section class="card"><h3>'+titulo+'</h3>'+cuerpo+'</section>'; }
/* ---------- inicio ---------- */
function vInicio(){
  var er=lee(K.err,{}), pend=Object.keys(er).filter(function(k){ return !er[k].ok; }).length, rep=lee(K.rep,{}), now=Date.now(), venc=Object.keys(rep).filter(function(k){ return rep[k].prox<=now; }).length, dg=lee(K.diag,{}), cf=lee(K.conf,{});
  var sd=(cf.s_ok||0), sn=(cf.s_no||0), tot=sd+sn;

  V.innerHTML='<section class="card"><p class="mu num" style="letter-spacing:.08em;text-transform:uppercase;font-size:.8rem">Herramientas de estudio</p><h1>Estudia con lo que ya sabes y con lo que te falla</h1><p class="mu">Cinco herramientas que trabajan juntas con las lecciones. Todas usan las preguntas reales del banco de MathUNAL.</p></section>'
  +'<div class="grid">'
  +'<a class="card" href="#diagnostico" style="text-decoration:none;color:inherit"><h3>Diagnóstico</h3><p class="mu">Unas pocas preguntas por materia dicen por dónde empezar, sin leer todo.</p><p class="num">'+(Object.keys(dg).length?Object.keys(dg).length+' materia(s) diagnosticada(s)':'Todavía sin diagnóstico')+'</p></a>'

/* ---------- diagnóstico ---------- */
function vDiag(){
  V.innerHTML='<section class="card"><h2>Diagnóstico por materia</h2><p class="mu">Escoge una materia. Son unas 10 preguntas, una por tema repartido a lo largo del curso. Al final ves qué temas dominas y por dónde conviene empezar.</p><div class="row" id="dg-c">'+CURSOS.map(function(c){ var n=lecDe(c).length; return '<button class="btn sec" type="button" data-c="'+esc(c)+'">'+esc(c)+' <span class="num" style="margin-left:8px">'+n+'</span></button>'; }).join('')+'</div></section><div id="dg-b"></div>';
  [].forEach.call(V.querySelectorAll('#dg-c button'),function(b){ b.addEventListener('click',function(){ diagCurso(b.getAttribute('data-c')); }); });
}
function eligeUna(l){ var s=l.q.filter(function(q){ return q.sim; }); var p=s.length?s:l.q; return p[Math.floor(Math.random()*p.length)]; }

  }
  function cierre(){
    var dg=lee(K.diag,{}), items={}; res.forEach(function(r){ items[r.q.lid]={ok:r.ok,conf:r.conf}; }); dg[c]={ts:Date.now(),items:items}; guarda(K.diag,dg);

    var filas=orden.map(function(l){ var it=items[l.id]; var e=it?(it.ok?'dom':'rev'):'new'; var t=it?(it.ok?'Lo manejas':'Conviene repasar'):'Sin preguntas en este diagnóstico'; return '<tr><td><span class="est e-'+e+'"></span><a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.titulo)+'</a></td><td>'+t+'</td></tr>'; }).join('');

/* ---------- repaso mezclado ---------- */
function vRepaso(pre){

  V.innerHTML='<section class="card"><h2>Repaso mezclado</h2><p class="mu">Se arman preguntas de varios temas, sin dos seguidas del mismo. Primero salen los puntos que fallaste, los que tocan por repaso y los que el diagnóstico marcó. Mezclar cuesta más, y por eso se aprende para más tiempo.</p>'
  +'<div class="row"><label for="rp-c">Materia</label><select id="rp-c"><option value="">Todas</option>'+CURSOS.map(function(c){ return '<option>'+esc(c)+'</option>'; }).join('')+'</select><label for="rp-n">Preguntas</label><select id="rp-n"><option>8</option><option selected>12</option><option>20</option></select><button class="btn" type="button" id="rp-go">Empezar</button></div>'+(tieneErr?'':'<p class="mu">Todavía no tienes errores guardados. El repaso tomará preguntas al azar de las lecciones.</p>')+'</section><div id="rp-b"></div>';
  if(pre&&pre.curso) document.getElementById('rp-c').value=pre.curso;
  document.getElementById('rp-go').addEventListener('click',function(){ repaso(document.getElementById('rp-c').value,+document.getElementById('rp-n').value,pre&&pre.lid); });
  if(pre&&pre.auto) repaso(pre.curso||'',pre.n||8,pre.lid);
}
function repaso(curso,N,soloLid){
  var er=lee(K.err,{}), rep=lee(K.rep,{}), dg=lee(K.diag,{}), now=Date.now(), pool=[];
  D.lecciones.forEach(function(l){ if(curso&&l.curso!==curso) return; if(soloLid&&l.id!==soloLid) return; l.q.forEach(function(q){ var w=0.5+Math.random();
    var e=er[q.lid+'|'+q.hk]; if(e&&!e.ok) w+=5; var r=rep[l.id]; if(r&&r.prox<=now) w+=3; var d=dg[l.curso]&&dg[l.curso].items&&dg[l.curso].items[l.id]; if(d&&!d.ok) w+=3; if(estado(l.id)==='rev') w+=1.5; pool.push({q:q,w:w}); }); });
  pool.sort(function(a,b){ return b.w-a.w; });
  var elegidas=[], usadas={}; pool.forEach(function(p){ if(elegidas.length>=N) return; var cnt=usadas[p.q.lid]||0; if(cnt>=(soloLid?N:2)) return; usadas[p.q.lid]=cnt+1; elegidas.push(p.q); });
  /* intercalar, sin dos seguidas de la misma lección */
  var res=[], rest=barajar(elegidas);
  while(rest.length){ var k=rest.findIndex(function(q){ return !res.length||res[res.length-1].lid!==q.lid; }); if(k<0) k=0; res.push(rest.splice(k,1)[0]); }
  var i=0, resultados=[], b=document.getElementById('rp-b');
  if(!res.length){ b.innerHTML='<section class="card"><p>No hay preguntas para esta selección.</p></section>'; return; }
  function paso(){
    if(i>=res.length) return fin();
    b.innerHTML='<section class="card"><div class="row"><span class="chip">Pregunta '+(i+1)+' de '+res.length+'</span></div><div class="bar" role="img" aria-label="Avance"><i style="width:'+Math.round(100*i/res.length)+'%"></i></div><div id="rp-q"></div></section>';
    preguntar(res[i],document.getElementById('rp-q'),function(r){ resultados.push(r); var mz=lee(K.mez,{}), m=mz[r.q.lid]||{ok:0,no:0}; if(r.ok) m.ok++; else m.no++; m.ult=r.ok?1:0; m.ts=Date.now(); mz[r.q.lid]=m; guarda(K.mez,mz); i++; paso(); },{etiqueta:i+1>=res.length?'Ver resultado':'Siguiente'});
  }
  function fin(){
    var ok=resultados.filter(function(r){ return r.ok; }).length, fall=resultados.filter(function(r){ return !r.ok; });
    var cal=[['s','Seguro'],['m','Más o menos'],['a','Adivino']].map(function(c,ix){ var k=[2,1,0][ix]; var t=resultados.filter(function(r){ return r.conf===k; }); var a=t.filter(function(r){ return r.ok; }).length; return '<tr><td>'+c[1]+'</td><td class="num">'+t.length+'</td><td class="num">'+(t.length?Math.round(100*a/t.length)+' %':'sin datos')+'</td></tr>'; }).join('');
    b.innerHTML='<section class="card"><h2>Resultado</h2><p class="num" style="font-size:1.6rem">'+ok+' de '+resultados.length+' correctas</p>'+(fall.length?'<p>Para repasar</p><ul>'+fall.map(function(r){ return '<li><a href="'+esc(LEC[r.q.lid].url)+'" target="_blank" rel="noopener">'+esc(LEC[r.q.lid].titulo)+'</a></li>'; }).join('')+'</ul><p class="mu">Quedaron en tu cuaderno de errores.</p>':'<p>Sin errores en esta tanda.</p>')+'<table class="tabla"><caption class="sr">Seguridad contra aciertos</caption><thead><tr><th>Dijiste</th><th>Veces</th><th>Acertaste</th></tr></thead><tbody>'+cal+'</tbody></table><div class="row"><button class="btn" type="button" id="rp-otra">Otra tanda</button><a class="btn sec" href="#cuaderno">Ver el cuaderno</a></div></section>';
    document.getElementById('rp-otra').addEventListener('click',function(){ vRepaso(); });
  }
  paso();
}
/* ---------- cuaderno ---------- */
function vCuaderno(){
  var er=lee(K.err,{}), claves=Object.keys(er), f={cur:'',est:'pend'};
  function pinta(){
    var lista=claves.filter(function(k){ var e=er[k]; return (!f.cur||e.curso===f.cur)&&(f.est==='todos'||(f.est==='pend'?!e.ok:e.ok)); }).sort(function(a,b){ return (er[b].ts||0)-(er[a].ts||0); });
    var cont=document.getElementById('cu-l');
    if(!lista.length){ cont.innerHTML='<section class="card"><p>'+(claves.length?'No hay errores con este filtro.':'Todavía no hay errores guardados. Cuando falles una pregunta en una lección o aquí, quedará anotada con la razón.')+'</p></section>'; return; }
    cont.innerHTML=lista.map(function(k){ var e=er[k], q=PQ[k], ult=e.fallos&&e.fallos[e.fallos.length-1]||{};
      var cuerpo; if(q){ cuerpo='<div class="q">'+mt(q.h)+'</div>'; var eleg=''; if(q.t==='mcq'&&ult.i!=null){ eleg='<p><b>Elegiste</b> '+mt(q.o[ult.i])+'</p>'; if(q.er&&q.er[ult.i]) eleg+='<p class="mu">'+mt(q.er[ult.i])+'</p>'; } else if(q.t==='num'&&ult.resp!=null){ eleg='<p><b>Escribiste</b> '+esc(ult.resp)+'</p>'; }
        cuerpo+=eleg+'<p><b>Respuesta correcta</b> '+(q.t==='mcq'?mt(q.o[q.c]):esc(q.r))+'</p><p class="mu">'+mt(q.e||'')+'</p>'; }
      else cuerpo='<p class="mu">Esta pregunta viene de una actividad de la lección. Ábrela para verla de nuevo.</p>'+(ult.err?'<p>'+esc(ult.err)+'</p>':'');
      var l=LEC[e.lid]; return '<article class="card err'+(e.ok?' res':'')+'" data-k="'+esc(k)+'"><div class="row"><span class="chip">'+esc(e.curso||'')+'</span><span class="chip">'+esc(e.lt||'')+'</span><span class="chip num">'+e.n+(e.n===1?' fallo':' fallos')+'</span>'+(e.ok?'<span class="chip">Entendido</span>':'')+'</div>'+cuerpo+'<div class="row">'+(q?'<button class="btn sec" type="button" data-pr>Practicar de nuevo</button>':'')+(l?'<a class="btn sec" href="'+esc(l.url)+'" target="_blank" rel="noopener">Abrir la lección</a>':'')+(!e.ok?'<button class="btn sec" type="button" data-ent>Ya lo entendí</button>':'')+'<button class="btn sec" type="button" data-del aria-label="Quitar del cuaderno">Quitar</button></div><div data-pb></div></article>'; }).join('');
    mates(cont);
    [].forEach.call(cont.querySelectorAll('article'),function(a){ var k=a.getAttribute('data-k'); var pr=a.querySelector('[data-pr]'), en=a.querySelector('[data-ent]'), de=a.querySelector('[data-del]');
      if(pr) pr.addEventListener('click',function(){ var pb=a.querySelector('[data-pb]'); preguntar(PQ[k],pb,function(){ er=lee(K.err,{}); pinta(); },{etiqueta:'Listo'}); });
      if(en) en.addEventListener('click',function(){ er[k].ok=true; er[k].tsok=Date.now(); guarda(K.err,er); pinta(); });
      if(de) de.addEventListener('click',function(){ delete er[k]; claves=Object.keys(er); guarda(K.err,er); pinta(); }); });
  }
  var cursos=CURSOS.filter(function(c){ return claves.some(function(k){ return er[k].curso===c; }); });
  V.innerHTML='<section class="card"><h2>Cuaderno de errores</h2><p class="mu">Aquí queda cada pregunta que fallaste, con lo que elegiste, por qué estaba mal y cuál era la respuesta. Practícalas de nuevo hasta que las entiendas.</p><div class="row" role="group" aria-label="Filtros"><button type="button" class="chip" data-e="pend" aria-pressed="true">Por entender</button><button type="button" class="chip" data-e="res" aria-pressed="false">Entendidos</button><button type="button" class="chip" data-e="todos" aria-pressed="false">Todos</button>'+cursos.map(function(c){ return '<button type="button" class="chip" data-cu="'+esc(c)+'" aria-pressed="false">'+esc(c)+'</button>'; }).join('')+'</div>'+(claves.length?'<div class="row"><a class="btn" href="#repaso">Hacer un repaso con mis errores</a></div>':'')+'</section><div id="cu-l" style="display:flex;flex-direction:column;gap:16px"></div>';
  [].forEach.call(V.querySelectorAll('[data-e]'),function(b){ b.addEventListener('click',function(){ f.est=b.getAttribute('data-e'); [].forEach.call(V.querySelectorAll('[data-e]'),function(o){ o.setAttribute('aria-pressed',o===b?'true':'false'); }); pinta(); }); });
  [].forEach.call(V.querySelectorAll('[data-cu]'),function(b){ b.addEventListener('click',function(){ var v=b.getAttribute('data-cu'); f.cur=(f.cur===v?'':v); [].forEach.call(V.querySelectorAll('[data-cu]'),function(o){ o.setAttribute('aria-pressed',o.getAttribute('data-cu')===f.cur?'true':'false'); }); pinta(); }); });
  pinta();
}
/* ---------- mapa ---------- */
function vMapa(){
  var cur=CURSOS[0];
  V.innerHTML='<section class="card"><h2>Mapa de prerrequisitos</h2><p class="mu">Cada cuadro es una lección y cada flecha va de lo que conviene saber antes hacia lo que sigue. El color sale de tus respuestas en las lecciones, el diagnóstico y el repaso mezclado.</p><div class="row" id="mp-c" role="group" aria-label="Materia">'+CURSOS.map(function(c){ return '<button type="button" class="chip" data-c="'+esc(c)+'" aria-pressed="false">'+esc(c)+'</button>'; }).join('')+'</div><div class="leyenda"><span><i class="est e-new"></i>sin datos</span><span><i class="est e-vis"></i>visto</span><span><i class="est e-rev"></i>por revisar</span><span><i class="est e-dom"></i>dominado</span></div></section><div class="mapa" id="mp-m"></div><section class="card" id="mp-p" aria-live="polite"><p class="mu">Toca una lección para ver de qué depende y qué puedes hacer con ella.</p></section>';
  function dibuja(c){
    [].forEach.call(V.querySelectorAll('#mp-c button'),function(b){ b.setAttribute('aria-pressed',b.getAttribute('data-c')===c?'true':'false'); });
    var ls=lecDe(c), mods={}, mn=[]; ls.forEach(function(l){ if(!mods[l.modulo]){ mods[l.modulo]=[]; mn.push(l.modulo); } mods[l.modulo].push(l); });
    var W=178,H=46,GX=72,GY=16,pos={}, maxf=0;
    mn.forEach(function(m,ci){ mods[m].forEach(function(l,ri){ pos[l.id]={x:64+ci*(W+GX),y:44+ri*(H+GY)}; maxf=Math.max(maxf,ri+1); }); });
    var wsvg=64+mn.length*(W+GX), hsvg=44+maxf*(H+GY)+10, s='<svg width="'+wsvg+'" height="'+hsvg+'" viewBox="0 0 '+wsvg+' '+hsvg+'" role="group" aria-label="Mapa de prerrequisitos de '+esc(c)+'" role="group">';
    mn.forEach(function(m,ci){ s+='<text class="colt" x="'+(64+ci*(W+GX))+'" y="26">'+esc(m.replace(/^Módulo \d+\s*/,'Módulo '+(ci+1)+' ').slice(0,30))+'</text>'; });
    ls.forEach(function(l){ (D.prereq[l.id]||[]).forEach(function(p){ if(!pos[p]) return; var a=pos[p], b=pos[l.id]; var x1=a.x+W, y1=a.y+H/2, x2=b.x, y2=b.y+H/2; if(a.x===b.x){ var yy1=a.y+H/2, yy2=b.y+H/2; s+='<path class="arista" d="M'+a.x+' '+yy1+' C'+(a.x-Math.min(54,18+Math.abs(yy2-yy1)/6))+' '+yy1+' '+(b.x-Math.min(54,18+Math.abs(yy2-yy1)/6))+' '+yy2+' '+b.x+' '+yy2+'"/>'; } else { var mx=(x1+x2)/2; s+='<path class="arista" d="M'+x1+' '+y1+' C'+mx+' '+y1+' '+mx+' '+y2+' '+x2+' '+y2+'"/>'; } }); });
    var col={new:'var(--n-new)',vis:'var(--n-vis)',rev:'var(--n-rev)',dom:'var(--n-dom)'};
    ls.forEach(function(l){ var p=pos[l.id], e=estado(l.id); s+='<g class="nodo" tabindex="0" role="button" data-id="'+esc(l.id)+'" aria-label="'+esc(l.titulo)+', '+NOM[e]+'"><rect x="'+p.x+'" y="'+p.y+'" width="'+W+'" height="'+H+'" rx="12" fill="var(--surf)" stroke="none"/><rect x="'+p.x+'" y="'+p.y+'" width="'+W+'" height="'+H+'" rx="12" fill="'+col[e]+'" fill-opacity="'+(e==='new'?0.55:0.9)+'"/><text x="'+(p.x+10)+'" y="'+(p.y+19)+'">'+esc(l.titulo.length>24?l.titulo.slice(0,23)+'…':l.titulo)+'</text><text x="'+(p.x+10)+'" y="'+(p.y+36)+'" style="font-size:10.5px;fill:var(--mu)">'+NOM[e]+'</text></g>'; });
    s+='</svg>'; var mm=document.getElementById('mp-m'); mm.innerHTML=s;
    function sel(id){ var l=LEC[id], e=estado(id); [].forEach.call(mm.querySelectorAll('.nodo'),function(n){ n.classList.toggle('sel',n.getAttribute('data-id')===id); });
      var pre=(D.prereq[id]||[]).map(function(p){ var q=LEC[p]; if(!q) return ''; var pe=estado(p); return '<li><span class="est e-'+pe+'"></span><a href="'+esc(q.url)+'" target="_blank" rel="noopener">'+esc(q.titulo)+'</a> <span class="mu">'+esc(q.curso)+', '+NOM[pe]+'</span></li>'; }).join('');
      var sig=Object.keys(D.prereq).filter(function(k){ return (D.prereq[k]||[]).indexOf(id)>=0&&LEC[k]; }).map(function(k){ return '<li><span class="est e-'+estado(k)+'"></span><a href="'+esc(LEC[k].url)+'" target="_blank" rel="noopener">'+esc(LEC[k].titulo)+'</a> <span class="mu">'+esc(LEC[k].curso)+'</span></li>'; }).join('');
      var faltan=(D.prereq[id]||[]).filter(function(p){ return LEC[p]&&estado(p)==='rev'; });
      document.getElementById('mp-p').innerHTML='<h3>'+esc(l.titulo)+'</h3><p class="mu">'+esc(l.curso)+', '+esc(l.modulo)+'</p><p><i class="est e-'+e+'"></i>'+NOM[e]+'</p>'+(faltan.length?'<p><b>Ojo.</b> Antes conviene repasar '+faltan.map(function(p){ return esc(LEC[p].titulo); }).join(' y ')+'.</p>':'')+'<div class="grid"><div><h3 style="font-size:1rem">Conviene saber antes</h3>'+(pre?'<ul>'+pre+'</ul>':'<p class="mu">Es un punto de partida.</p>')+'</div><div><h3 style="font-size:1rem">Lo que viene después</h3>'+(sig?'<ul>'+sig+'</ul>':'<p class="mu">Todavía no hay lecciones que dependan de esta.</p>')+'</div></div><div class="row"><a class="btn" href="'+esc(l.url)+'" target="_blank" rel="noopener">Abrir la lección</a><button class="btn sec" type="button" id="mp-pr">Practicar este tema</button></div>';
      document.getElementById('mp-pr').addEventListener('click',function(){ vRepaso({curso:l.curso,lid:l.id,auto:true,n:Math.min(6,l.q.length)}); window.scrollTo(0,0); }); }
    [].forEach.call(mm.querySelectorAll('.nodo'),function(n){ n.addEventListener('click',function(){ sel(n.getAttribute('data-id')); }); n.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); sel(n.getAttribute('data-id')); } }); });
  }
  [].forEach.call(V.querySelectorAll('#mp-c button'),function(b){ b.addEventListener('click',function(){ dibuja(b.getAttribute('data-c')); }); });
  dibuja(cur);
}
var RUTAS={'#inicio':vInicio,'#diagnostico':vDiag,'#repaso':function(){ vRepaso(); },'#cuaderno':vCuaderno,'#mapa':vMapa};
function ruta(){ var h=location.hash||'#inicio'; if(!RUTAS[h]) h='#inicio'; [].forEach.call(document.querySelectorAll('nav a'),function(a){ if(a.getAttribute('href')===h) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); }); RUTAS[h](); mates(V); }
window.addEventListener('hashchange',ruta); ruta();
})();
